#######################################################################
# 总入口参数（pnc_2d）—— 三节点共用一份文件，各自只看自己那一段
#
# 用法（launch 会自动合并多份 yaml，**后加载的覆盖先加载的**）：
#   pnc_2d.launch.py                                  → 三节点一键起（推荐）
#   global_planner.launch.py                          → 只起全局（调试用）
#   global_planner.launch.py planner_type:=route_network
#   local_planner.launch.py   local_type:=none         → 只起局部
#
# 分工约定（重要，别把参数放错地方）：
#   · 本文件 = **跨模式/跨节点共用**：话题名、坐标系、代价语义、车体轮廓、
#     路径有效期、状态机心跳周期…；这里写的 planner.type / local.type 只是
#     "默认值"，会被片段覆盖；
#   · config/<算法名>.yaml = **算法私有参数**，并**自述自己的类型**
#     （planner.type: "astar" / local.type: "none"），单独看就知道它给谁用；
#   · 节点**自己**的参数用 `节点前缀.*`：全局 `planner.*`、局部 `local.*`、
#     状态机 `sm.*`；**算法**的参数用算法前缀（`astar.*` / `route_network.*` /
#     将来的 `local_mpc.*`）—— 两类不要混；
#   · 节点允许未声明参数（allow_undeclared_parameters）+ 自动声明覆盖项，
#     所以片段里加新键不用改代码。
#
# 【段落为什么写 `/**` 而不是节点名】两个原因，都实测过：
#   ① **namespace 无关**：段名写成节点名时，`ns:=/e2e` 会让**整个文件的参数失效**
#      —— 节点 FQN 变成 /e2e/global_planner，不再匹配 `global_planner:` 这个键，
#      而且不会有任何报错（只有 `/**` 或 `/e2e/global_planner` 才匹配）。
#      验证：同一文件在根命名空间下生效 4 项参数，加 ns 后只剩 `/**` 的那 2 项。
#   ② 三个节点的参数前缀本来就是错开的（planner./common./footprint. vs local.* vs
#      sm.*），共用一个段落不会打架；而且再也不可能出现"把 local.type 写到
#      global_planner 段下、静默不生效"这种坑（P3 真实踩过）。
#   ⚠ 一个文件里只能有**一个** `/**` 段：YAML 顶层重复键会互相覆盖（只留最后一个），
#     所以三组参数写在同一个段落里，用注释分组。
#   代价：`ros2 param dump` 会多出其它节点的键（不影响行为）。
#######################################################################
/**:
  ros__parameters:
    use_sim_time: false

    # ---------------- 算法选择（默认值，会被 fragment 覆盖）----------------
    planner.type: "astar"
    planner.frame_id: "map"

    # ---------------- 接口话题 ----------------
    # 【命名规则】外部的（别人的包发的）写**绝对**名；自家的（本包发/收的）
    #   写**相对**名。在根命名空间下两者完全等价（相对名会拼上节点命名空间），
    #   但加上 namespace 就能整套搬走 —— 仿真/实车双栈共存、E2E 隔离都靠它。
    #   E2E 测试就是这么做的：ns:=/e2e + extra_config 把外部 IO 指到 /t/*。
    topics.map: "/global_map/occupancy"          # 外部：map_server 发布（latched）
    topics.odom: "/lightning/perception/pose"    # 外部：定位（Odometry, map -> lidar_link）
    topics.goal: "/goal_pose"                    # 外部：RViz "2D Goal Pose"（三节点模式下由 manager 独占）
    topics.path: "pnc_2d/global_path"            # 自家：输出几何路径
    topics.markers: "pnc_2d/plan_markers"        # 自家：起终点箭头 + 起点处车体轮廓
    topics.status: "pnc_2d/global_status"        # 自家：规划状态（latched，失败上报用）

    # ---------------- 路径有效期 ----------------
    # 失败时总是自动清空（发空 Path），避免上层拿到过期路径；
    # 到达目标是否清空默认 **false**："任务是否结束"由状态机（P4）判断，
    # 规划器不替它决定。需要这个便利行为就打开。
    clear.auto_on_goal_reached: false
    clear.goal_tolerance: 0.30                    # 判定"到达"的距离 [m]

    # ==================================================================
    # 代价语义（所有算法共用）
    # ==================================================================
    # ⚠ 未知区域策略必须与全局图一致：
    #   map_server 已把未知当空闲发布（unknown_as_free: true），所以这里默认保守
    #   （把 -1 当障碍）不会误伤；若将来全局图保留 -1，需要把两边一起改。
    common.hard_threshold: 80          # ≥ 该值视为硬障碍（100 = 占据）
    common.unknown_as_occupied: true   # 未知格是否当障碍（保守）
    common.soft_cost_weight: 5.0       # 软代价权重：(raw/阈值)² × 该值；0 = 关闭
                                       # ⚠ 只对 0<raw<阈值 的“软格”生效，而全局图
                                       #   被 map_server 膨胀后往往是全 0/100 ⇒
                                       #   这一项在仿真里基本是空转的（见下面净距偏好）

    # ---------------- 全局层的“净距偏好”（2026-09-23 用户要求）----------------
    # 目的：让**全局路径**自己就走在离墙远一点的地方 ⇒ 局部几乎不需要横向避让。
    # 为什么用“偏好”而不是把 map_server.inflate 调大：硬膨胀是**约束**，会把窄
    #   通道直接判死。用户定的规则：机体 0.40 m + **左右各 10 cm** = 最窄可通
    #   0.60 m ⇒ 硬判据必须恰好停在
    #       footprint 半宽 0.20 + safe_margin 0.05 + map_server.inflate 0.05 = 0.30 m
    #   （半宽 0.20 + 0.10 = 0.30 ✓ 就是“各 10 cm”）。所以硬层**不能再加**，
    #   要不就改用软偏好：比 prefer 更窄仍然可走，只是代价高一点。
    # 实现：直接用精确距离场（`ClearanceField`）算，与地图原始值无关（所以一定有
    #   效，不像 common.soft_cost_weight 那样靠地图里真有“软格”）。
    planner.clearance_prefer_dist: 0.60     # 希望离障碍至少这么远 [m]（0 = 关）
    planner.clearance_cost_weight: 2.0      # 低于它时每米额外代价权重（0 = 关）

    # ==================================================================
    # 矩形车体轮廓（footprint）—— 与 perception 的命名保持一致
    # ==================================================================
    # 只查致命格、不看膨胀梯度：安全性由 footprint 保证，舒适性由软代价保证。
    footprint.enable: true
    footprint.length: 0.70             # 机体系 x：前后（m）← Go2
    footprint.width: 0.40              # 机体系 y：左右（m）
    footprint.offset_x: 0.0            # 参考点不在矩形中心时用
    footprint.offset_y: 0.0
    footprint.safe_margin: 0.05        # 四边各外扩（m）
    footprint.check_edges: true        # 边扫掠（四角轨迹 + 中心线），防"擦角"
    footprint.fast_path: true          # 内切/外接双阈值快路径（距离场，1 次查表）


#######################################################################
# ---- 局部规划节点（local_planner）：P4 只有 Null 实现，**不产生任何速度指令** ----
#######################################################################
    use_sim_time: false

    # 算法选择（默认值，会被 config/local_<类型>.yaml 片段覆盖）
    local.type: "none"
    local.frame_id: "map"

    # ---------------- 接口话题 ----------------
    topics.odom: "/lightning/perception/pose"          # 外部：与全局节点同一个位姿源
    # 局部图：**未膨胀**的那张（grid_map/occupancy_2d）。
    # ⚠ 2026-09-23 从 occupancy_inflate_2d 换过来的（用户改）：感知的膨胀图是
    #   按 `double_cylinder_radius: 0.25` 膨胀的，叠上车体半宽 0.30 后要求
    #   "中心到真障碍 ≥ 0.55 m"，而全局侧只保证 0.35 m ——
    #   中间那 0.20 m 就是"全局给路、局部说 footprint 重叠拿不下" 的死区
    #   （实测症状：车开到半路停住不动，恢复重规划还是同一条路 ⇒ FAILED）。
    #   换成未膨胀图后：局部要求 max(0.30 footprint, 0.25 ESDF 硬下界) = 0.30 m
    #   < 全局的 0.35 m ⇒ **全局接受的路径局部一定能跟**（这就是对齐的不变量）。
    #   局部对障碍的硬保证没变：ESDF 本来就是拿未膨胀层算的
    #   （perception `build2DESDF()` 用 occ2d_），解后还有真实净距复核。
    topics.local_map: "/grid_map/occupancy_2d"
    topics.esdf: "/grid_map/esdf_2d"                    # 外部：距离场（PointXYZI 点云）
    topics.local_status: "pnc_2d/local_status"          # 自家：局部状态（latched）

    # ---------------- 区域在**局部侧**的额外膨胀 ----------------
    # ★ 默认 0，**不要**填成 map_server 的 `zones.inflate`（= 0.05）。
    #   分工：全局图负责"多留几 cm"（真障碍按 `map_server.inflate` 膨胀、禁行区按
    #   `zones.inflate` 烧入），局部按**原几何**判，余量就是那几 cm。
    #   如果局部也按同一个值融一遍（栅格 + 距离场），两边判据就**完全相等 = 零余量**：
    #   栅格离散化本身就有 ±半格（全局图 0.05 m 格 ⇒ ±2.5 cm），于是出现
    #   "全局刚判过、局部说参考路径在障碍里" ⇒ 局部 BLOCKED ⇒ 恢复重规划又因
    #   **起点**余量重叠而失败 ⇒ 任务永久 FAILED、车既不动也不结束。
    #   2026-09-23 实测：车离禁行区 Z1 边界 0.283 m，两边都要求 0.30 m（差 1.7 cm）。
    #   语义上这与 `topics.local_map` 用**未膨胀**图完全同构：局部看真实几何。
    zones.local_inflate: 0.0

    # ---------------- 控制 ----------------
    # cmd_vel 的**唯一 owner 是局部节点**（谁控车谁发速度），状态机不插手，
    # 避免两个节点同时发速度打架。接底盘时把这里改到实车话题。
    local.cmd_vel_topic: "pnc_2d/cmd_vel"
    local.control_rate: 20.0           # 控制周期 [Hz]
    local.goal_tolerance: 0.30         # 距路径终点 ≤ 该值算"到达" [m]
    local.pass_distance: 0.50          # 距路径点 ≤ 该值算"经过"（用于算进度）[m]
    local.odom_timeout: 1.0            # 位姿超过该时长没更新 → 降级停发 [s]
    # ---- 距离场（P5.3 接线）----
    # 注意：感知的 esdf_2d **只在有订阅者时才计算**，所以下面这两个订阅就是
    # "让感知开始算距离场"的开关，删掉订阅感知就不算了。
    local.esdf_timeout: 0.3            # 距离场超过该时长没更新 → 降级限速 [s]
    local.esdf_max_distance: 3.0       # 距离场截断上限 [m]（必须 ≥ 感知的 esdf_max_dist，
                                       # 否则未覆盖格子会被低估成"有障碍"）
    local.esdf_fill_radius: 2           # 点云→栅格的邻域填充半径 [格]
                                       # （感知采样步长默认 2 格 = 0.2 m，至少要填 1 圈）
    # 被挡要**连续**持续这么久才结束跟随（把决定权交回状态机）：
    # 瞬时遮挡（有人走过、点云抖一帧）不该让任务失败。
    local.blocked_abort_s: 1.0

    # ---------------- 限速区前瞻用的减速度（兜底，一般不用配）----------------
    # 前瞻距离 = 从"可能达到的最大速度"按减速度 a 刹停的距离 + 0.3 m 余量
    # （`speedLookahead()`）：这样**进区时速度已经 ≤ 限速**，而不是进区才减速。
    # a 与 v 都**优先取算法自报的值**（`LocalPlanner::brakeAcc()` /
    # `maxSpeed()` = `local_mpc.brake_acc` / `local_mpc.v_max`）—— 减速度必须与
    # 终点制动剖面用同一个量，否则同一个限速区在不同配置下触发时机完全不同。
    # 本参数只在"算法不报"（非 MPC 实现）时兜底；**0 = 不兜底**（默认）。
    # 两处都配了且相差 >5% 会 WARN 一次，并说明按算法值算。
    local.brake_acc: 0.0


#######################################################################
# ---- 任务状态机节点（pnc_manager）：三节点的主控 ----
#######################################################################
    use_sim_time: false

    sm.frame_id: "map"

    # ---------------- 接口话题 ----------------
    topics.goal: "/goal_pose"                    # 外部：RViz "2D Goal Pose"（本节点独占消费）
    topics.odom: "/lightning/perception/pose"    # 外部：定位
    topics.state: "pnc_2d/state"                 # 自家：状态机状态（latched）

    # ---------------- 与另两个节点的 IPC ----------------
    # 写**相对**名：根命名空间下等价于 /global_planner/plan_path，
    # 加上 namespace（如 ns:=/e2e）就整套跟着搬，不会指到别人家的服务上。
    sm.global_plan_service: "global_planner/plan_path"
    sm.global_clear_service: "global_planner/clear_path"
    sm.local_follow_action: "local_planner/follow_path"
    sm.local_stop_service: "local_planner/stop"

    # ---------------- 状态机上限 ----------------
    # 一次任务内允许的恢复尝试次数。**恢复成功也不清零** —— 这就是
    # "挡住→恢复→再挡→再恢复…"无限循环的防线。
    sm.max_recoveries: 2
    # 全局规划失败允许的重试次数（0 = 一次失败即任务失败）。
    # 默认 0：失败通常是"目标不可达"这类确定性结论，重试没意义。
    sm.max_plan_failures: 0

    # ---------------- 卡住/跳变判据 ----------------
    # 用**自车位移**判断卡住（不依赖局部反馈）：参照点挪动超过
    # stuck_min_progress 就重新计时，否则超过 stuck_timeout 发 Stuck 事件。
    sm.stuck_timeout: 10.0             # [s]
    sm.stuck_min_progress: 0.20        # [m]
    # 两帧位姿之间位移超过该值 → 认为定位跳变（正常步态不可能），
    # 基于旧位姿的路径不再可信 → 触发重规划。0 = 关闭该检测。
    sm.odom_jump_threshold: 1.0        # [m]
    # 跳变的冷却时间：跳变是异常事件，但可能**连续**发生（两条定位源同时在发、
    # 重定位后的恢复期…）。没有冷却的话每次跳变都会触发一次重规划，形成
    # "重规划风暴"（实测踩过：20 Hz 位姿 × 两条源交替 → 每秒几十次）。
    sm.odom_jump_cooldown: 2.0         # [s]
    sm.heartbeat_hz: 5.0               # 心跳周期（卡住检测 + 状态话题刷新）

    # ---------------- 恢复行为（P5.4 起真正接上）----------------
    # 被挡/卡住时执行什么。可选项见 availableRecoveries()；目前只有 "replan"：
    # "用**当前**地图重新规划一次" —— 本仓库里被挡绝大多数是"路径与当前局面不同源"
    # （地图/区域刚改、定位跳变、动态障碍占道），正确处置就是重规划，而不是让车
    # 在原地做动作。配成未知名字会在启动时 WARN 并且被挡即判失败。
    #
    # ★ 这里以前是**空的实现**，后果比想象严重：进入 RECOVERING 后没人跑恢复、
    #   也没有事件把它推出去 ⇒ 状态机永久卡在 RECOVERING，任务既不会完成也不会
    #   失败，而且 RECOVERING **不接受新目标**（实测：仿真里被挡一次后，后续目标
    #   全被静默拒绝，只能重启节点）。
    sm.recovery.type: "replan"
    # 重规划防抖 [s]：距上次成功规划不到该间隔就**如实报恢复失败**（0 = 关闭，
    # 默认）。默认关的理由：额度上限 max_recoveries 已经收住了"挡住→恢复→再挡"，
    # 第二道闸只会把"规划后 0.3 s 才出现的动态障碍"这类**真可恢复**的情况直接判失败。
    replan.min_interval_s: 0.0

