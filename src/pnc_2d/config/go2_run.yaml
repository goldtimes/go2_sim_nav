#######################################################################
# Go2 底盘运行覆盖项（仿真 / 真车同一套 cmd_vel → 步态控制器）
#
# 用法：
#   ros2 launch pnc_2d pnc_2d.launch.py planner_type:=astar local_type:=heading_shim \
#     use_sim_time:=true \
#     extra_config:=$(ros2 pkg prefix pnc_2d)/share/pnc_2d/config/go2_run.yaml
#   （`heading_shim` = 原地转向装饰器 + MPC 主控制器；launch 会同时加载
#     local_heading_shim.yaml 与 local_mpc.yaml）
#
# 这份文件只放**规划器该关心**的车体参数：
#   · 速度入口话题（这台车/这个仿真的 cmd_vel 在哪）
#   · 车体物理能力上限（v_max / w_max / 加速度）
# 不放任何"控制器不是直通"的补偿 —— 那是底盘侧的事，见下面【已知问题】。
#######################################################################
/**:
  ros__parameters:
    # 本平台默认用**装饰器**：转向（起步对正/到点对正）在 shim 里做，
    # MPC 当纯跟踪器（原因见 doc/minco_trajectory_plan.md §M5.2）。
    local.type: "heading_shim"

    # 底盘速度入口（仿真里由 cmd_vel_pub 桥接到步态控制器）
    local.cmd_vel_topic: "/robot1/cmd_vel"

    # ---- 车体物理能力：与上面实测值对齐 ----
    local_mpc.v_max: 0.42           # 物理最大前向速度 [m/s]（实测饱和值 0.415）
    local_mpc.w_max: 0.65           # 物理最大角速度 [rad/s]（实际约 0.65*0.7≈0.46）
    local_mpc.a_max: 0.60           # 步态起步/减速比轮式慢，加速度上限调小
    local_mpc.brake_acc: 0.15       # ★ 实测值：参考里的终点制动剖面 v ≤ sqrt(2·a·s_rem)
                                    # 用它决定"从多远开始减速"。原来写 0.6（= a_max）
                                    # 等于认为底盘能按 0.6 m/s² 刹住，实测根本做不到：
                                    # 指令归零后车还滑 6~9 cm ⇒ 有效减速 ≈ v²/(2d) ≈
                                    # 0.14²/(2·0.075) ≈ 0.13 m/s²。写小了只是让车早点
                                    # 开始减速（更慢到点），写大了就会冲过目标点。

    # ★ 终点段（用户要求停点误差 ≤ 3 cm）：慢速贴拢 + 保底爬行。
    #   只靠 brake_acc 剖面不行：它在最后 ~1 cm 才把参考压到 0，而步态要 ~1 s 才
    #   停住、其间以 2~4 cm/s 蹭出 3~5 cm（实测停点误差 0.03~0.06 m）。
    local_mpc.stop_coast: 0.035      # ★ 停车惯性距离 [m]：**实测标定值**（用户要求停点
                                     # 误差 ≤ 3 cm）。含义：从"指令归零"到"车真的停住"
                                     # 底盘还会自己走的距离 —— 终点剖面按
                                     # `剩余弧长 − stop_coast` 算 ⇒ 指令提前归零，惯性
                                     # 正好把最后几厘米带完；到点判定用同一个值
                                     # （planner_->stopCoast()），不重复配。
                                     # 标定过程（多次实测，见验收脚本的"沿行驶方向"）：
                                     #   · stop_coast=0  ：**全部冲过**目标 0.03~0.06 m
                                     #   · 0.015        ：仍偏长 +0.003~+0.037（均值 +0.022）
                                     #   · 0.035        ：-0.018~+0.010，停点误差 0.015~0.024 m ✓
                                     # ⚠ 2026-09-28（M5.3）试过抬到 0.050：**三次实测下来
                                     #   没有任何变化**（冲过量仍 +0.017；到点 0.029/0.015/
                                     #   0.037）⇒ 已回退。原因记在这里，免得再试一遍：
                                     #   **到点判定并不靠这个提前量** —— 节点只在算法报
                                     #   `kGoalReached` 时才去判残差，而算法是 `remaining ≤
                                     #   1e-3` 才报的 ⇒ 判定点几乎就落在目标上，
                                     #   `along − stop_coast ≤ tol` 这条**根本没机会提前生效**。
                                     #   真正决定停点的是**底盘属性**：收到停止指令后还会
                                     #   走 ~2~4 cm（实测判定后路程 0.08~0.11 m，沿航向净值
                                     #   ≈ +0.02 m）。⇒ 到点误差 ≈ 2~4 cm，**已经贴着 3 cm
                                     #   这条线**，再拧这些参数没用（要动得动底盘步态的停止
                                     #   行为，那是底盘侧的事）。
                                     # 与到点速度有关（贴拢速度越大惯性越长），所以
                                     # 改 approach_* 后要重新标它。
    local_mpc.approach_dist: 0.0     # 进入终点段的距离 [m]；0 = 关（**2026-09-28 关的**）
    local_mpc.approach_speed: 0.03   # 终点段参考速度上限 [m/s]（跟着 approach_dist 一起不生效）
    local_mpc.crawl_speed: 0.015     # 终点段参考速度下限（参考绝不先于目标归零，
                                     # 否则车会差几厘米停死、到点判据永不满足）
    # ★★ 为什么把"慢速贴拢段"关掉（M5.3，量出来的，别改回去）：
    #   它是**阶跃**的 —— `s_rem ≤ approach_dist` 那一刻参考从制动剖面的
    #   sqrt(2·0.15·(0.15−0.035)) = 0.186 直接跳到 0.03，那一步要求 **0.49 m/s²**，
    #   而底盘实测能力只有 **0.15 m/s²**（差 3.3 倍）⇒ 参考在那一段**物理上跟不上**。
    #   实测后果：终点前 7 cm 时 v_ref=0.030 而车还是 **0.24 m/s**、控制器还发 0.18
    #   ⇒ 高速贴到目标 ⇒ 判定后滑行 8~11 cm ⇒ 停点误差在 **6 mm ~ 43 mm** 之间随机
    #   （同一套代码，要求 ≤3 cm）。
    #   ⇒ 想让它不阶跃，就得 approach_speed ≥ 制动剖面在该点的值 —— 那正好等于
    #     **钳位什么都不做**。也就是说这一项只可能"阶跃(跟不上)"或"空操作"，
    #     没有中间态 ⇒ 正解是不设它，让制动剖面自己减速（那是自洽的：同一个
    #     brake_acc，减到目标前 stop_coast 处归零）。
    #   ⚠ 爬行保底 crawl_speed **不跟着关**：它防的是另一件事（参考先于目标归零 ⇒
    #     车差几厘米停死）。代码里已经把它从 approach 块里拆出来（原来关掉 approach
    #     会把它一起关掉，是个隐藏耦合）。
    #   ⚠ 换底盘/改 approach_* 之前先跑 `TerminalProfileIsFollowableByTheChassis`
    #     （它会打印逐段的"要求减速度 vs 底盘能力"）。

    # ★ 大航向偏差：先原地对正机头，再沿路径走（用户 2026-09-22 定的行为）。
    #   不加这个时：严格走廊（corridor_width=0）下航向差 ≥30° ⇒ MPC 找不到同时满足
    #   "走廊硬界 + 模型动力学"的解（"边转边走"会扫出硬界）⇒ 整段一直 BLOCKED、
    #   车一步不动（实测 30/40/60° 均为 0.000 m / 6 s）。足式/差速底盘 ω 与 v 解耦，
    #   原地转正物理可行 ⇒ 先对正再走是唯一同时满足"严格走廊"和"能动"的做法。
    #
    # ★ 这一段参数的**实现**在 M5.2 已搬到装饰器（键前缀从 `local_mpc.` 变成
    #   `shim.`，见 local_heading_shim.yaml）。这里只留平台标定值与它的来历：
    #   · `shim.engage_deg 15.0` ← 原 align_in_place_deg 的**实测标定**（严格走廊
    #     corridor_width=0、6 s 闭环）：
    #       航向差 10/20°：走得很好（2.01 m）
    #       航向差 30/40/60°：**一步不走**（60/60 周期 BLOCKED ⇒ RECOVERING）
    #     拒动阈值在 20~30° 之间，所以阈值必须取在它**以下**：原来设 30°（要 >30
    #     才触发）正好漏在边界上，现场现象就是用户报的"有角度的路网时机器基本不会动"；
    #     设 15° 后 30/40/60° 均能对正后起步（1.3~1.6 m / 6 s，先转 ~0.5 s）。
    #   · `shim.disengage_deg 8.0` ← 原 align_exit_deg（滞环）。
    #   · 原 align_gain(1.2) / align_w_min(0.20) **已被 √(2α·e) 减速律取代**：
    #     增益式控制律在误差小时会给出落进底盘死区的小指令（0.06 rad/s），
    #     只能靠"ω 下限"打补丁；恒速+斜坡律不需要它（见 local_heading_shim.yaml）。
    #     ⇒ 底盘角速度死区 ~0.20 rad/s 仍是**实测事实**，只是现在靠
    #       shim.alpha_max 3.2 让指令两拍就冲过死区。
    local_mpc.lat_acc_max: 0.80     # 侧向加速度上限（低速转弯）
    local_mpc.degraded_speed_limit: 0.15

    # ---------------- 转向装饰器（heading_shim）的平台标定 ----------------
    # 只有**属于这台底盘**的量写在这里；阀值/前瞻用的是库默认（45°/22.5°/0.5 m）。
    shim.omega_rot: 0.60             # 旋转角速度上限 [rad/s]。
                                     #   R10：交棒那一刻 ω 就是这个量，必须 ≤
                                     #   主控制器能给的角速度 ⇒ 这里 ≤ w_max 0.65。
                                     #   它**刻意大于** free_w_max(0.45)：那个上限是
                                     #   为压自由模式"左右打满"的摆动，而这里是有意的
                                     #   原地转，按底盘能力（w_max）取。
    shim.alpha_max: 3.20             # 角加速度上限 [rad/s²]。
                                     #   ★ 底盘角速度死区 ~0.20 rad/s（实测事实）：
                                     #     α·dt 必须让它几拍内冲过死区。α=1.2 时首周期
                                     #     只有 0.06 rad/s（卡在死区里）；α=3.2 时 0.16，
                                     #     两拍（0.1 s）到 0.32 ⇒ 起步真的会动。
                                     #     旧实现是靠 `align_w_min: 0.20` 硬抬下限解决
                                     #     的（增益式控制律的补丁），现在不需要了。
    # ⚠ 不要把 `shim.engage_deg` 降回旧的 15°：旧 15° 是对**车脚下那一点**的朝向
    #   测出来的，而现在比的是**前方 0.5 m 处的朝向** —— 后者在急弯/路线拐点前就会
    #   超阀值 ⇒ 阀值取小了会"逢拐点就停车转身"。15° 对应半径 ~2 m 的弯，太松。
    #   30° 以上航向差下"拒动"那个坑已由**另一条触发条件**堆住：主控制器报被挡 +
    #   车头偏着 ⇒ 接管转正（不需要靠调小阀值）。

    # 巡航参考速度（0 = 用 v_max）。留余量，不要贴着饱和区跑
    local_mpc.reference_speed: 0.35

    # 到点判定容差 [m]：**用户要求停点误差 ≤ 3 cm**。
    #
    # 为什么是 1 cm 而不是 2~3 cm（这是量出来的，不是拍脑袋）：判定到达后底盘还要
    # 花 ~0.5 s 才真的停住（步态响应滞后），其间以终点段速度再前进 1~3 cm。
    # 所以判定点必须**贴到目标附近**，把这段滞后位移算进 3 cm 预算里：
    #   判定容差 0.02 时实测停点 0.024~0.054 m（超差）；收到 0.01 后见 §5.4 表。
    local.goal_tolerance: 0.01

    # 速度反馈：lightning 的 twist 低速时噪声大且均值偏低（实测车走 0.045 m/s
    # 时读到 -0.03），而 MPC 的命令在模型里受 "v_0 + a_max·dt" 限制 ⇒ 反馈不准就
    # 永远起不来。改从位姿差分算（位姿本身可靠）。
    local.vel_from_pose: true
    local.vel_pose_window: 0.25

    # ==================================================================
    # 轨迹优化（MINCO）：把 A* 折线换成"几何 + 运动学可行"的时间参数化轨迹
    # ==================================================================
    # 打开后：free 模式（无走廊）下，全局节点对 A* 结果跑一次 MINCO，**通过两道门**
    #   （净距终检 + 运动学终验）才用它替换路径，并把 v/ω 剖面一起下给局部。
    #   ⇒ `/pnc_2d/global_path` 上发布的就是**优化后的稠密路径**（`traj.publish_spacing`
    #     = 5 cm），不再是 A* 的折线。
    # 打开的依据（M4.5 A/B：同一段走廊、同一目标各跑一趟，表见
    #   doc/minco_trajectory_plan.md 附录）：
    #     ω 反向次数 10 次 / 1.47 Hz → **0 次**；稳态 RMS|ω| 0.015 → 0.011 rad/s（−27%）
    #     到点误差 0.023 → 0.016 m；路径点数 2 → 63；参考偏差均值 4.2%（剖面真的生效）
    #     代价：到点用时 +9%（16.67 s vs 15.26 s）
    #   ★ "直线段也在 1.47 Hz 左右打摆"是自由模式的老毛病，用上游剖面后消失。
    # ⚠ 走廊模式（route）**永远不优化**（贴线是硬约束，挪线等于改需求）⇒ 跑路网时
    #   下发的仍是 A* 路径。这是设计，不是漏开关。
    # ⚠ 它同时是局部"参考剖面"的唯一来源：`local_mpc.use_upstream_profile: true` 时
    #   MPC 采纳剖面的 v/ω。A/B 对照就是把这个键切回 none。
    # 排查靠日志（全局节点）：
    #   `[traj] **采用** MINCO 轨迹：路径 N 点 → 下发 M 点（间距 …）/ 剖面 K 点`
    #   `[traj] **不采用** ← <原因>`（两道门没过、弧长非单调、超长截断等都会走这条）
    traj.type: "minco"
