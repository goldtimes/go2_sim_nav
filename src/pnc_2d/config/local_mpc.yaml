#######################################################################
# 局部规划片段：MPC（local.type: mpc）
#
# 算法结构参考 **SLAM-PNC/PNC 的 MpcController**（阿克曼 + (a,δ) + OSQP 稀疏 QP），
# 按差速底盘映射成 (a, ω)，并新增走廊硬约束与 ESDF 避障项。
# 推导/取舍/踩坑见 doc/mpc_local_planner_plan.md 与
# include/pnc_2d/local/mpc_local_planner.hpp 顶部注释。
#
# 用法：ros2 launch pnc_2d local_planner.launch.py local_type:=mpc
#       ros2 launch pnc_2d pnc_2d.launch.py   local_type:=mpc
# 公共参数（话题/坐标系/控制周期/到达容差）在 config/pnc_2d.yaml（总入口）。
#
# ⚠ 参数分两类，别混：
#   local.*      = **局部节点**的（控制周期、到位容差、话题名）→ 总入口
#   local_mpc.*  = **MPC 算法**的（权重、时域、限幅、距离场、OSQP）→ 本文件
#######################################################################
/**:
  ros__parameters:
    local.type: "mpc"

    # ==================================================================
    # 时域
    # ==================================================================
    local_mpc.dt: 0.1            # 预测步长 [s]；节点控制周期应与它一致
    local_mpc.horizon: 15        # 预测步数 N（1.5 s 前瞻；窗口 N+1 点）

    # ==================================================================
    # 权重（比例参考 SLAM-PNC 的调参，量级按 Go2 缩放）
    #   SLAM-PNC：q_x=q_y=30000, q_yaw=1500, q_v=100；r_a=30, r_delta=60；
    #             rd_a=150, rd_delta=400（比例 300:15:1 / 1:2 / 1:2.67）
    # ==================================================================
    local_mpc.q_x: 1000.0        # 世界系 x 偏差
    local_mpc.q_y: 1000.0        # 世界系 y 偏差（≈横向偏差，直线段上与 q_x 同权）
    local_mpc.q_yaw: 50.0        # 航向偏差
    local_mpc.q_v: 3.0            # 速度偏差
                                  # 曾怀疑它太小导致"车不走"（严格走廊下算过
                                  # 横向代价 ≈18 > 不加速的速度代价 ≈5.5），
                                  # 实测**扫过** q_v=3 与 50：两种取值行为完全一致
                                  # ⇒ 不是 q_v 的问题（真因是参考切线在毫米级
                                  # 基线上算成噪声，见 rebuildReference）。
                                  # 没证据就不动它。
    local_mpc.r_a: 2.0           # 纵向加速度偏差代价
    local_mpc.r_w: 4.0           # 角速度偏差代价
    local_mpc.rd_a: 5.0          # 加速度变化率（平滑）
    local_mpc.rd_w: 14.0         # 角速度变化率（平滑）
    # 终端状态权重放大：直接改善"到点精度"（P5.4 要求 ≤ 0.15 m）
    local_mpc.terminal_weight_scale: 3.0

    # ==================================================================
    # 限幅（v 是**状态**约束，a/ω 是**控制**约束 —— 与 SLAM-PNC 一致）
    # ==================================================================
    local_mpc.v_max: 1.0         # 最大前向速度 [m/s]
    local_mpc.v_min: 0.0         # 不倒车
    local_mpc.a_max: 1.0         # |纵向加速度| [m/s²]
    local_mpc.w_max: 0.8         # |角速度| [rad/s]
    local_mpc.alpha_max: 1.5     # |角加速度| [rad/s²]（作用在 Δω 上）
    # 变化率是否作为**硬约束**：默认 false（只惩罚）。
    # 硬约束在路网拐角处参考突变时会直接把 QP 顶成不可行，反而更难用（同 SLAM-PNC）。
    local_mpc.constrain_control_rate: false

    # ==================================================================
    # 参考轨迹（我们的输入是纯几何折线，时间参数化要自己造）
    # ==================================================================
    local_mpc.reference_speed: 0.0     # >0 覆盖巡航速度；0 = 用 v_max/通道限速
    # ★★ A/B 开关（M4.3）：有上游剖面时**换掉**本地的曲率限速（lat_acc_max），
    #   并用上游的 ω 顶替 κ·v。
    #   true （默认）：听上游剖面；false：忽略剖面（= M4.2 之前的现网行为）。
    #   ★ 是“换掉”不是“取 min”：两套曲率减速的**减速点位置**不同，取 min 会让
    #     较保守的一方在弯道里把上游剖面完全盖住（等于白接）。
    #   ★ 注意：`traj.type: none` 时上游根本不会发剖面 ⇒ 这个开关无害。
    local_mpc.use_upstream_profile: true
    local_mpc.lat_acc_max: 1.5         # 曲率限速：允许的向心加速度 [m/s²]
    # 减速度 [m/s²]。**单一来源**：既做终点制动剖面（v ≤ sqrt(2·a·s_rem)），
    # 也被节点拿去算限速区前瞻距离（LocalPlanner::brakeAcc()）。
    # 换底盘要按实测改这个值（它会同时影响"停得多准"和"多早开始限速"）；
    # 别再单独配 local.brake_acc，两处不一致会 WARN（那只是个非 MPC 的兜底项）。
    local_mpc.brake_acc: 1.0
    local_mpc.curvature_lookahead: 2.0 # 曲率前瞻距离 [m]（提前减速，别到弯口才减）
    local_mpc.back_window: 1.0         # 投影允许向后回退的最大弧长 [m]（防进度抖）

    # ==================================================================
    # 走廊（route profile）：硬约束
    # ==================================================================
    # route/free 是**数据驱动**的：action goal 里给了走廊 ⇒ route，否则 free。
    # "严格贴线"（corridor_width=0）时的数值下限：要求 0 mm 横向偏差的 QP 在任何
    # 噪声下都不可行，会退化成"一有偏差就 BLOCKED"。0.05 m ≈ 半个格。
    local_mpc.corridor_min_tolerance: 0.05

    # ==================================================================
    # 障碍（软代价 + 线性化硬下界 + 解后复核）
    # ==================================================================
    local_mpc.obstacle_weight: 1000.0       # 软代价权重；0 = 关闭（纯跟踪）
                                           #   400 → 1000 是 2026-09-23 实测扫出来的：
                                           #   实测（单测 ObstacleCostSweep*）：3000 →
                                           #   +3.5 cm、10000 → +5.6 cm 净距，但偏离
                                           #   参考线同样多，且在窄通道里更容易不可行；
                                           #   400 → 1000 只要 +1.6 cm、速度不受影响。
    local_mpc.obstacle_safe_distance: 0.45  # 软代价开始生效的距离 [m]（≈半车宽+余量）
    local_mpc.obstacle_hard_distance: 0.25  # 硬下界 [m]：预测点距离不得小于它
    local_mpc.obstacle_hard_enable: true
    # 缺距离场时的限速（只靠硬判定走路必须慢）
    local_mpc.degraded_speed_limit: 0.30

    # ==================================================================
    # 转向 / 到点朝向：**不在本片段**（M5.2 搬走了）
    # ==================================================================
    # MPC 现在只做**跟踪**。两套对正都已搬到装饰器 `local.type: heading_shim`
    # （参数在 `config/local_heading_shim.yaml`，键前缀 `shim.`）：
    #   · 起步/急弯前"大航向差先原地转"   ← 原 align_in_place_deg / align_exit_deg /
    #                                        align_gain / align_w_min / align_min_clearance
    #   · 到终点位置后"对正目标朝向"       ← 原 goal_yaw_tolerance_deg /
    #                                        goal_yaw_align_distance / goal_yaw_align_timeout
    # 为什么搬：① 转向与跟踪是两件事，MPC 的目标函数只能给出"边转边走"的妥协
    #   （严格走廊下航向差 ≥30° ⇒ 实测 120/120 周期被挡、一步不走）；② 同一个
    #   物理量（朝向容差）原来在两处各配一份；③ 旋转需要 footprint 扫掠检查，
    #   而轮廓检查不属于 MPC。
    # ⚠ 因此单独跑 `local.type: mpc` 时**没有任何朝向对正**（大角度起步会"边转边走"、
    #   终点也不管朝向）。要完整行为请用 `local.type: heading_shim`。

    # ==================================================================
    # 自由模式的“顺滑优先”（用户 2026-09-23）
    # ==================================================================
    # 自由导航的参考只是"大致往那儿走"的折线，不需要像走廊那样严格贴线；
    # 原来两模式共用同一套贴线权重（q_x/q_y=1000、q_yaw=50）⇒ 几 cm 横向偏差 +
    # 几度航向偏差就被当成大误差追，实测 `w` 在相邻周期从 +0.65 打到 −0.65
    # （顶满，周期 1~2 s）—— 现场看就是"摇摇摆摆"。
    # 这里是**策略选择**（库层默认中立 = 严格），走廊模式不受影响。
    local_mpc.free_lat_scale: 0.25     # 横向权重缩放（1 = 与走廊一样严）
                                       # ★ 2026-09-28 标定（死区关掉后重调）：
                                       #   同一段走廊来回、每次先掉头 180° 再走 3 m，
                                       #   一次只动一个旋钮，指标一律用**位姿**算：
                                       #     0.5  → 位姿 RMS|ω| 0.061（0.047~0.084）、
                                       #            max 0.164、到点横向残差 0.1~1.2 cm
                                       #     0.25 → RMS|ω| **0.036**（0.035~0.036，**离散度
                                       #            从 1.8× 收到 1.03×**）、max 0.083、
                                       #            残差 0.4~0.7 cm  ⇒ 取它
                                       #   0.25 已收敛到位（初偏 5~15 cm 的腿 3 m 内就到 0.2~0.3 cm）；
                                       #   再往下没试（长路径/弯道需另测）。
    local_mpc.free_yaw_scale: 0.5      # 航向权重缩放（实测降到 0.25 无额外收益，保留 0.5）
    # ★ 横向死区：**已关闭（2026-09-28 实测）**。
    #   原理：自由模式下把**整条参考线平移到车所在的那一侧**（限幅 ±deadband）
    #   ⇒ 带内的横向偏差对 MPC 不再是"跟踪误差"（不去追），而 `info_.cross_track`
    #   故意不改 ⇒ 外部看到"一个不衰减的偏置"。
    #   ⚠ 它连**终端目标**也一起平移了 ⇒ 到点横向精度被写死成 deadband。
    #   实测（`test/sim/track_probe.py`，同一条 3 m 直线、都要先掉头 180°、
    #   各跑 3 条腿；顺滑度一律用**位姿**算）：
    #     deadband | 稳态横向偏置 | 到点横向残差 | 位姿 RMS|ω| | 位姿 ω 反向
    #       0.10   |  +3.8~+4.3 / −5.1 cm | 4.5~6.0 cm | 0.034 | 15
    #       0.00   | **−0.2 ~ +0.1 cm** | **0.01~0.9 cm** | 0.051 | **14**
    #   ⇒ 车体摆动基本不变（ω 反向 15→14、max|ω| 0.087→0.112 rad/s），
    #     而横向精度好转 40×。指令 w 的反向次数翻倍（11→21）是 MPC 每周期
    #     重规划的噪声，底盘滤掉了 —— 别用指令判顺滑度。
    #   ⇒ 结论：死区是**把验收口径吃掉**的设计缺陷（它同时是 2026-09-23 为治
    #     摇摆在一次改动里加的四个旋钮之一）。保留代码路径以便回滚，但配置置 0。
    local_mpc.free_lat_deadband: 0.0   # 0 = 关（推荐；非 0 会写死到点横向精度）
    local_mpc.free_w_max: 0.45         # 自由模式 |ω| 上限 [rad/s]（0 = 用 w_max）
                                       # ⚠ 2026-09-28 实测：收到 0.20 在**位姿**指标上
                                       #   无收益（RMS 0.038 vs 0.036），但会把自由模式的
                                       #   转向能力从 0.45 降到 0.20 rad/s（0.2 m/s 时最小
                                       #   半径 0.44 → 1.0 m），而标定只在直线腿上做过
                                       #   ⇒ 保留 0.45。原地对正走的是 w_max，不受本项影响。

    # ==================================================================
    # OSQP
    # ==================================================================
    local_mpc.osqp_max_iter: 4000
    local_mpc.osqp_eps_abs: 1.0e-4
    local_mpc.osqp_eps_rel: 1.0e-4
