#######################################################################
# 总入口参数（pnc_2d）—— 三节点共用一份文件，各自只看自己那一段
#
# 用法（launch 会自动合并多份 yaml，**后加载的覆盖先加载的**）：
#   pnc_2d.launch.py                                  → 三节点一键起（推荐）
#   global_planner.launch.py                          → 只起全局（调试用）
#   global_planner.launch.py planner_type:=route_network
#   local_planner.launch.py   local_type:=none         → 只起局部
#
# 分工约定（重要，别把参数放错地方）：
#   · 本文件 = **跨模式/跨节点共用**：话题名、坐标系、代价语义、车体轮廓、
#     路径有效期、状态机心跳周期…；这里写的 planner.type / local.type 只是
#     "默认值"，会被片段覆盖；
#   · config/<算法名>.yaml = **算法私有参数**，并**自述自己的类型**
#     （planner.type: "astar" / local.type: "none"），单独看就知道它给谁用；
#   · 节点**自己**的参数用 `节点前缀.*`：全局 `planner.*`、局部 `local.*`、
#     状态机 `sm.*`；**算法**的参数用算法前缀（`astar.*` / `route_network.*` /
#     将来的 `local_mpc.*`）—— 两类不要混；
#   · 节点允许未声明参数（allow_undeclared_parameters）+ 自动声明覆盖项，
#     所以片段里加新键不用改代码。
#
# 【段落为什么写 `/**` 而不是节点名】两个原因，都实测过：
#   ① **namespace 无关**：段名写成节点名时，`ns:=/e2e` 会让**整个文件的参数失效**
#      —— 节点 FQN 变成 /e2e/global_planner，不再匹配 `global_planner:` 这个键，
#      而且不会有任何报错（只有 `/**` 或 `/e2e/global_planner` 才匹配）。
#      验证：同一文件在根命名空间下生效 4 项参数，加 ns 后只剩 `/**` 的那 2 项。
#   ② 三个节点的参数前缀本来就是错开的（planner./common./footprint. vs local.* vs
#      sm.*），共用一个段落不会打架；而且再也不可能出现"把 local.type 写到
#      global_planner 段下、静默不生效"这种坑（P3 真实踩过）。
#   ⚠ 一个文件里只能有**一个** `/**` 段：YAML 顶层重复键会互相覆盖（只留最后一个），
#     所以三组参数写在同一个段落里，用注释分组。
#   代价：`ros2 param dump` 会多出其它节点的键（不影响行为）。
#######################################################################
/**:
  ros__parameters:
    use_sim_time: false

    # ---------------- 算法选择（默认值，会被 fragment 覆盖）----------------
    planner.type: "astar"
    planner.frame_id: "map"

    # ---------------- 接口话题 ----------------
    # 【命名规则】外部的（别人的包发的）写**绝对**名；自家的（本包发/收的）
    #   写**相对**名。在根命名空间下两者完全等价（相对名会拼上节点命名空间），
    #   但加上 namespace 就能整套搬走 —— 仿真/实车双栈共存、E2E 隔离都靠它。
    #   E2E 测试就是这么做的：ns:=/e2e + extra_config 把外部 IO 指到 /t/*。
    topics.map: "/global_map/occupancy"          # 外部：map_server 发布（latched）
    topics.odom: "/lightning/perception/pose"    # 外部：定位（Odometry, map -> lidar_link）
    # ★★ 位姿参考点补偿（2026-09-29 实测后加，三节点必须一致）
    #   定位发的 `lightning/perception/pose` 是**雷达**位姿：
    #     loc_system.cc: T_map_lidar = T_map_base·T_base_imu·T_imu_lidar，
    #                    child_frame_id = "lidar_link"
    #   而雷达装在车心**前方 0.22 m**（URDF velodyne_joint = lightning 配置
    #   go2_gazebo_sim.yaml 的 extrinsic_base_imu_T = [0.22, 0, 0.09]）。
    #   导航里所有判据（footprint 碰撞、到点、净距、MPC 初始状态、卡住/进度）
    #   都该按**车心**算 ⇒ 在消费入口一次性平移过去：
    #       车心 = 雷达位置 − R(yaw)·(off_x, off_y)
    #   实测不补偿的代价：车头真实余量只剩 1.8 cm（footprint 却以为有 0.238 m），
    #   车尾最后 0.28 m 完全没保护（S2 里“FOLLOWING 下顶进箱子”就是这么来的）。
    #   **0 = 位姿已经是车心**（换平台/定位改成发 base_link 后就改回 0）。
    pose.base_offset_x: 0.22
    pose.base_offset_y: 0.0
    topics.goal: "/goal_pose"                    # 外部：RViz "2D Goal Pose"（三节点模式下由 manager 独占）
    topics.path: "pnc_2d/global_path"            # 自家：输出几何路径
    topics.markers: "pnc_2d/plan_markers"        # 自家：起终点箭头 + 起点处车体轮廓
    topics.status: "pnc_2d/global_status"        # 自家：规划状态（latched，失败上报用）

    # ---------------- 路径有效期 ----------------
    # 失败时总是自动清空（发空 Path），避免上层拿到过期路径；
    # 到达目标是否清空默认 **false**："任务是否结束"由状态机（P4）判断，
    # 规划器不替它决定。需要这个便利行为就打开。
    clear.auto_on_goal_reached: false
    clear.goal_tolerance: 0.30                    # 判定"到达"的距离 [m]

    # ==================================================================
    # 代价语义（所有算法共用）
    # ==================================================================
    # ⚠ 未知区域策略必须与全局图一致：
    #   map_server 已把未知当空闲发布（unknown_as_free: true），所以这里默认保守
    #   （把 -1 当障碍）不会误伤；若将来全局图保留 -1，需要把两边一起改。
    common.hard_threshold: 80          # ≥ 该值视为硬障碍（100 = 占据）
    common.unknown_as_occupied: true   # 未知格是否当障碍（保守）
    common.soft_cost_weight: 5.0       # 软代价权重：(raw/阈值)² × 该值；0 = 关闭
                                       # ⚠ 只对 0<raw<阈值 的“软格”生效，而全局图
                                       #   被 map_server 膨胀后往往是全 0/100 ⇒
                                       #   这一项在仿真里基本是空转的（见下面净距偏好）

    # ---------------- 全局层的“净距偏好”（2026-09-23 用户要求）----------------
    # 目的：让**全局路径**自己就走在离墙远一点的地方 ⇒ 局部几乎不需要横向避让。
    # 为什么用“偏好”而不是把 map_server.inflate 调大：硬膨胀是**约束**，会把窄
    #   通道直接判死。用户定的规则：机体 0.40 m + **左右各 10 cm** = 最窄可通
    #   0.60 m ⇒ 硬判据必须恰好停在
    #       footprint 半宽 0.20 + safe_margin 0.05 + map_server.inflate 0.05 = 0.30 m
    #   （半宽 0.20 + 0.10 = 0.30 ✓ 就是“各 10 cm”）。所以硬层**不能再加**，
    #   要不就改用软偏好：比 prefer 更窄仍然可走，只是代价高一点。
    # 实现：直接用精确距离场（`ClearanceField`）算，与地图原始值无关（所以一定有
    #   效，不像 common.soft_cost_weight 那样靠地图里真有“软格”）。
    planner.clearance_prefer_dist: 0.60     # 希望离障碍至少这么远 [m]（0 = 关）
    planner.clearance_cost_weight: 2.0      # 低于它时每米额外代价权重（0 = 关）

    # ==================================================================
    # 矩形车体轮廓（footprint）—— 与 perception 的命名保持一致
    # ==================================================================
    # 只查致命格、不看膨胀梯度：安全性由 footprint 保证，舒适性由软代价保证。
    footprint.enable: true
    # ★★ 2026-09-29 按实测外廓改（量法：scripts/measure_go2_extent.py，实时 TF + mesh）
    #   这台 Go2 站立时的真实外廓（车体系）：x ∈ [−0.407, +0.332]、y ∈ ±0.163
    #   （前 +0.33 = 躯干前脸，后 −0.41 = 后腿/脚往后摆）⇒ **车体不以原点为中心**。
    #   旧值 0.70×0.40 + offset 0（对称）会得到：车头只剩 1.8 cm 余量、
    #   **车尾 5.7 cm 露在 footprint 之外**（后腿完全没被保护）。
    #   现在：前后各留 ~2 cm ⇒ 长 0.78、中心偏 −0.038（覆盖 [−0.428, +0.352]）。
    #   ⚠ 与 perception 的 `grid_map.footprint_*`（同一台车、同一套语义）必须对齐：
    #     那边参考点是**雷达**，所以 offset_x = −0.22 − 0.038 = **−0.258**、
    #     length 同样是 0.78。改一边必须改另一边。
    footprint.length: 0.78             # 机体系 x：前后（m）← Go2 实测外廓
    footprint.width: 0.40              # 机体系 y：左右（m）
    footprint.offset_x: -0.038         # 矩形中心相对**车心**的偏移（前后不对称）
    footprint.offset_y: 0.0
    footprint.safe_margin: 0.05        # 四边各外扩（m）
    footprint.check_edges: true        # 边扫掠（四角轨迹 + 中心线），防"擦角"
    footprint.fast_path: true          # 内切/外接双阈值快路径（距离场，1 次查表）


#######################################################################
# ---- 局部规划节点（local_planner）：P4 只有 Null 实现，**不产生任何速度指令** ----
#######################################################################
    use_sim_time: false

    # 算法选择（默认值，会被 config/local_<类型>.yaml 片段覆盖）
    local.type: "none"
    local.frame_id: "map"

    # ---------------- 接口话题 ----------------
    topics.odom: "/lightning/perception/pose"          # 外部：与全局节点同一个位姿源
    # 位姿参考点补偿：与全局/状态机一致（长注释见本文件第一段）
    pose.base_offset_x: 0.22
    pose.base_offset_y: 0.0
    # 局部图：**未膨胀**的那张（grid_map/occupancy_2d）。
    # ⚠ 2026-09-23 从 occupancy_inflate_2d 换过来的（用户改）：感知的膨胀图是
    #   按 `double_cylinder_radius: 0.25` 膨胀的，叠上车体半宽 0.30 后要求
    #   "中心到真障碍 ≥ 0.55 m"，而全局侧只保证 0.35 m ——
    #   中间那 0.20 m 就是"全局给路、局部说 footprint 重叠拿不下" 的死区
    #   （实测症状：车开到半路停住不动，恢复重规划还是同一条路 ⇒ FAILED）。
    #   换成未膨胀图后：局部要求 max(0.30 footprint, 0.25 ESDF 硬下界) = 0.30 m
    #   < 全局的 0.35 m ⇒ **全局接受的路径局部一定能跟**（这就是对齐的不变量）。
    #   局部对障碍的硬保证没变：ESDF 本来就是拿未膨胀层算的
    #   （perception `build2DESDF()` 用 occ2d_），解后还有真实净距复核。
    topics.local_map: "/grid_map/occupancy_2d"
    topics.esdf: "/grid_map/esdf_2d"                    # 外部：距离场（PointXYZI 点云）
    # ★★ 全局静态图（**融合用**，2026-09-29 用户口径）。
    #   口径：**2D 导航下"能不能过"必须由整套图一致决定，局部不得比全局宽松** ——
    #   "全局认为不能走 ⇒ 局部也不能走"。
    #   为什么必须融：局部图来自实时感知（滑动窗 + 高度带投影 + 车体 footprint
    #   抹空闲），全局图来自 PCD 离线投影。两者对同一块货柜可能给出**相反**结论
    #   （感知高度带上沿原来就 1.20 m，会把货柜 1.2 m 以上的部分整块滤掉 ⇒
    #    只剩立柱 ⇒ 局部以为能钻过去），而且感知只看得到它看过的地方。
    #   融进来后，车体轮廓与"全局不可通行"的格子重叠会被**现有 footprint 硬判定**
    #   直接判死，语义与全局一模一样（同禁行区的 burnForbidden）。
    #   ⚠ 保留 `map_server.inflate`（0.05）的膨胀：那正是全局规划器自己的安全保证，
    #     不要反向补偿（补了就又把"局部不得比全局宽松"破坏了）。
    topics.global_map: "/global_map/occupancy"        # 外部：map_server latched 发布
    topics.local_status: "pnc_2d/local_status"          # 自家：局部状态（latched）

    # ---------------- 区域在**局部侧**的额外膨胀 ----------------
    # ★ 默认 0，**不要**填成 map_server 的 `zones.inflate`（= 0.05）。
    #   分工：全局图负责"多留几 cm"（真障碍按 `map_server.inflate` 膨胀、禁行区按
    #   `zones.inflate` 烧入），局部按**原几何**判，余量就是那几 cm。
    #   如果局部也按同一个值融一遍（栅格 + 距离场），两边判据就**完全相等 = 零余量**：
    #   栅格离散化本身就有 ±半格（全局图 0.05 m 格 ⇒ ±2.5 cm），于是出现
    #   "全局刚判过、局部说参考路径在障碍里" ⇒ 局部 BLOCKED ⇒ 恢复重规划又因
    #   **起点**余量重叠而失败 ⇒ 任务永久 FAILED、车既不动也不结束。
    #   2026-09-23 实测：车离禁行区 Z1 边界 0.283 m，两边都要求 0.30 m（差 1.7 cm）。
    #   语义上这与 `topics.local_map` 用**未膨胀**图完全同构：局部看真实几何。
    zones.local_inflate: 0.0

    # ---------------- 全局图融合（局部 = 局部 ∪ 全局）----------------
    # ★★ 默认 **true**：这是用户 2026-09-29 定的不变量（"全局认为不能走 ⇒ 局部
    #   也不能走"）。false = 旧行为（局部只看感知），仅用于 A/B 对照。
    #   两个作用点（每帧都做，各自几何取**当帧**局部图）：
    #     ① 硬判定图：占据方向取并 ⇒ footprint 检查会拦住"全局不可通行"的格；
    #     ② 距离场：按 `到全局障碍的几何距离` 逐格取 min ⇒ MPC 的软代价/硬下界
    #        与①同源（不做②就会出现"硬说撞、软说很空旷"⇒ 贴到跟前急停）。
    #   ⚠ 副作用（已知、方向保守）：局部障碍边界比原来最多外扩一个局部格（0.10 m）；
    #     距离场在全局障碍附近多扣了 `map_server.inflate`（0.05 m）。
    #     ⇒ 若出现"全局能走、局部堵死"，先看日志里这两个数：
    #        "全局图融合（硬判定）：全局投影 N 格，其中 M 格是感知没看见的新障碍"
    local.fuse_global_map: true
    # 占据判定阈值（OccupancyGrid 约定 >= 50 即占据；map_server 发 100/0/-1）
    local.fuse_global_map_threshold: 50
    # 距离场压低带宽 [m]：只改"距全局障碍 ≤ band"的格子
    local.fuse_global_map_band: 1.5

    # ---------------- 控制 ----------------
    # cmd_vel 的**唯一 owner 是局部节点**（谁控车谁发速度），状态机不插手，
    # 避免两个节点同时发速度打架。接底盘时把这里改到实车话题。
    local.cmd_vel_topic: "pnc_2d/cmd_vel"
    local.control_rate: 20.0           # 控制周期 [Hz]
    local.goal_tolerance: 0.30         # 距路径终点 ≤ 该值算"到达" [m]
    # ★ 到点判定的**第二个正交条件**（2026-09-24 新增）：横向残差。
    #   为什么要单独一个：原来"到点"只比一个**欧氏距离** ⇒ 横向残差与"没走完"
    #   混在一起，报出来的"到点误差 10 cm"分不清该修哪个。实测那 10 cm **全是横向**
    #   （路径在 x=-6.50，车停在 x=-6.40，沿向只差 2 cm）—— 车其实走到了，只是
    #   没贴线。拆开后两个数各自可归因（失败消息里会直接写"沿向超"还是"横向超"）。
    #   ★ 0.10 原本是"当时控制器实测能到的水平"（不是目标值）。
    #     2026-09-28 关掉 `free_lat_deadband` 并把 `free_lat_scale` 标成 0.25 后，
    #     实测横向残差降到 **0.2~0.6 cm** ⇒ 收到 **0.03**（项目自己定的"到点 ≤3 cm"
    #     那条线才真正被锁住）。
    #   ⚠ 不能再往下收到 ~0.01：终点处车已经停下（v→0），横向偏差**没法再纠**
    #     （纠横向必须往前走），收到太紧会变成"到了却不判到达"的卡死。
    #   ⚠ 收紧的代价（已与用户确认，**不加守卫、如实报**）：遇到"退化场景"
    #     （路径 <2 m **且**起步要转 >45°）时，横向来不及收敛 ⇒ 节点判不出来 ⇒
    #     任务跑成超时。这是**场景**问题不是控制器问题（同一套代码在 3.75 m 上是
    #     1.6~2.7 cm）；处理办法是**换场景重跑**，不是让脚本把这条指标标成跳过。
    #     特征：`test_drive_goal` 会打印"候选[0] 规划 FAILED，换下一个"，随后选的
    #     目标离车很近而朝向差很大（如 1.0 m / 71°）。
    #   ⚠ 只在这里配一处（平台片段可覆盖）；别再复制到别的文件 ——
    #     `local.goal_tolerance` 就是因为两处都配（0.30 vs 0.01）而漂了 30 倍。
    local.lateral_tolerance: 0.03      # 到点横向容差 [m]
    # ---- 到点判定的**锁存**（M5.1，Nav2 SimpleGoalChecker 的 stateful 语义）----
    # true = 一旦三条判据都满足就**锁住**"已到"，直到下一个任务（`reset()`）。
    # 为什么需要它（实测故障）：算法已经报了"到终点"，但**判定之后底盘还会滑行**
    #   ~9 cm（实测 89 mm）⇒ 残差被推出容差 ⇒ 原来会把一次成功的到点报成 FAILED
    #   （假失败），并让 `test_drive_goal` 的"到点 ≤3 cm"时好时坏。
    # 判定本体在 `core/goal_checker`（可单测：test/test_goal_checker.cpp）。
    # false = 每周期按当下残差判（锁存关掉，只在调试"到底是谁在抖"时用）。
    local.goal_stateful: true
    local.pass_distance: 0.50          # 距路径点 ≤ 该值算"经过"（用于算进度）[m]
    local.odom_timeout: 1.0            # 位姿超过该时长没更新 → 降级停发 [s]
    # ---- 距离场（P5.3 接线）----
    # 注意：感知的 esdf_2d **只在有订阅者时才计算**，所以下面这两个订阅就是
    # "让感知开始算距离场"的开关，删掉订阅感知就不算了。
    local.esdf_timeout: 0.3            # 距离场超过该时长没更新 → 降级限速 [s]
    local.esdf_max_distance: 3.0       # 距离场截断上限 [m]（必须 ≥ 感知的 esdf_max_dist，
                                       # 否则未覆盖格子会被低估成"有障碍"）
    local.esdf_fill_radius: 2           # 点云→栅格的邻域填充半径 [格]
                                       # （感知采样步长默认 2 格 = 0.2 m，至少要填 1 圈）
    # ---------------- 被挡时的**有界等待**（2026-09-29 实测基线 S1~S4 后加）------
    # 旧行为：BLOCKED 连续 1 s 就结束 action、把决定权交回状态机。实测发现这
    # **不可逆地判死任务**：全局图（PCD 离线图）里**没有后来出现的障碍** ⇒ 恢复
    # 行为（重规划）算出来还是同一条路 ⇒ 2 次恢复用尽 → FAILED，而**障碍消失后
    # 车也不会自己继续**（S2 横穿、S4 撤障两个场景都是这个症状）。
    # 新行为：连续被挡期间**保持 action 存活**（车停住 + 明确发零速 + 状态照报
    # BLOCKED、反馈里有 blocked_for_s），障碍一消失立刻恢复跟随；**超时才**交回
    # 状态机（保留旧语义作兜底）。
    #   容差时长 ≈ (sm.max_recoveries + 1) × blocked_wait_s。
    #   ★ 2026-09-29 实测后从 6.0 提到 **8.0**：把动态障碍降到 0.3 m/s（用户要求，
    #     否则箱子会把车撞飞）后，一次横穿的**遮挡时长**从 ~3.7 s 涨到 ~10 s，
    #     6 s 的窗口会直接超时 ⇒ 任务 FAILED。仿真时间基准，屏幕上的墙钟时长
    #     还要除以 RTF（`scripts/sim_rtf.py` 可量）。
    local.blocked_wait_s: 8.0
    # "等也没用"的那一类：被挡点是**全局图**带来的障碍（感知没见到）或落在
    # 禁行区里 —— 静态的东西不会自己消失，白等只占任务时间 ⇒ 只等很短就交回
    # 状态机（≈ 旧行为）。判据见 `classifyBlock()`。
    local.blocked_wait_global_s: 1.0
    # ⚠ 跨层耦合：等待期间管理器看到的是"长时间没推进"，它自己的 sm.stuck_timeout
    #   （默认 10 s）会触发 kStuck → 恢复 ⇒ 两者叠加时**以先到的为准**。所以
    #   blocked_wait_s **必须明显小于** sm.stuck_timeout，否则"等待"会被管理器的
    #   卡住判据抢先打断（那就是一次无谓的重规划）。节点启动时会校验并 WARN。
    # ✗ 旧参数名 `local.blocked_abort_s`（语义＝"直接结束"）已废弃：只有**显式配置**
    #   时才会被读到（当作 blocked_wait_s 用），并打 WARN 提示改名。

    # ---------------- 限速区前瞻用的减速度（兜底，一般不用配）----------------
    # 前瞻距离 = 从"可能达到的最大速度"按减速度 a 刹停的距离 + 0.3 m 余量
    # （`speedLookahead()`）：这样**进区时速度已经 ≤ 限速**，而不是进区才减速。
    # a 与 v 都**优先取算法自报的值**（`LocalPlanner::brakeAcc()` /
    # `maxSpeed()` = `local_mpc.brake_acc` / `local_mpc.v_max`）—— 减速度必须与
    # 终点制动剖面用同一个量，否则同一个限速区在不同配置下触发时机完全不同。
    # 本参数只在"算法不报"（非 MPC 实现）时兜底；**0 = 不兜底**（默认）。
    # 两处都配了且相差 >5% 会 WARN 一次，并说明按算法值算。
    local.brake_acc: 0.0


#######################################################################
# ---- 任务状态机节点（pnc_manager）：三节点的主控 ----
#######################################################################
    use_sim_time: false

    sm.frame_id: "map"

    # ---------------- 接口话题 ----------------
    topics.goal: "/goal_pose"                    # 外部：RViz "2D Goal Pose"（本节点独占消费）
    topics.odom: "/lightning/perception/pose"    # 外部：定位
    # 位姿参考点补偿：与全局/局部一致（长注释见本文件第一段）
    pose.base_offset_x: 0.22
    pose.base_offset_y: 0.0
    topics.state: "pnc_2d/state"                 # 自家：状态机状态（latched）

    # ---------------- 与另两个节点的 IPC ----------------
    # 写**相对**名：根命名空间下等价于 /global_planner/plan_path，
    # 加上 namespace（如 ns:=/e2e）就整套跟着搬，不会指到别人家的服务上。
    sm.global_plan_service: "global_planner/plan_path"
    sm.global_clear_service: "global_planner/clear_path"
    sm.local_follow_action: "local_planner/follow_path"
    sm.local_stop_service: "local_planner/stop"
    # ★ 恢复行为 `clear_map` 要调的：**感知侧**的清图服务。
    #   名字 = `grid_map.clear_map_service`（默认 `grid_map/clear_map`）⇒ 全名
    #   `/grid_map/clear_map`（与 occupancy_2d 那族话题同一个前缀）。
    #   它把局部 3D 占据/2D 层/距离场整个作废，下一帧起按新观测重建。
    sm.perception_clear_service: "/grid_map/clear_map"

    # ---------------- 状态机上限 ----------------
    # 一次任务内允许的恢复尝试次数。**恢复成功也不清零** —— 这就是
    # "挡住→恢复→再挡→再恢复…"无限循环的防线。
    sm.max_recoveries: 2
    # 全局规划失败允许的重试次数（0 = 一次失败即任务失败）。
    # 默认 0：失败通常是"目标不可达"这类确定性结论，重试没意义。
    sm.max_plan_failures: 0

    # ---------------- 卡住/跳变判据 ----------------
    # 用**自车位移**判断卡住（不依赖局部反馈）：参照点挪动超过
    # stuck_min_progress 就重新计时，否则超过 stuck_timeout 发 Stuck 事件。
    sm.stuck_timeout: 25.0             # [s]
    sm.stuck_min_progress: 0.20        # [m]
    # 两帧位姿之间位移超过该值 → 认为定位跳变（正常步态不可能），
    # 基于旧位姿的路径不再可信 → 触发重规划。0 = 关闭该检测。
    sm.odom_jump_threshold: 1.0        # [m]
    # 跳变的冷却时间：跳变是异常事件，但可能**连续**发生（两条定位源同时在发、
    # 重定位后的恢复期…）。没有冷却的话每次跳变都会触发一次重规划，形成
    # "重规划风暴"（实测踩过：20 Hz 位姿 × 两条源交替 → 每秒几十次）。
    sm.odom_jump_cooldown: 2.0         # [s]
    sm.heartbeat_hz: 5.0               # 心跳周期（卡住检测 + 状态话题刷新）

    # ---------------- 恢复行为（P5.4 起真正接上）----------------
    # 被挡/卡住时执行什么。可选项见 availableRecoveries()：
    #   · "replan"    ：只"用**当前**地图重新规划一次"。治"路径与当前局面不同源"
    #                    （地图/区域刚改、定位跳变、动态障碍占道）。
    #   · "clear_map" ：★ 2026-09-29 新增，并**改为默认**。先让感知把局部图整个
    #                    清空（调用 `/grid_map/clear_map`），再由状态机重规划
    #                    （`Recovering→Planning` 是转移表规定的，行为不用自己请求）。
    #                    治"局部图**本身**是脏的"：
    #                      ★ 动态障碍离开后感知图残留"幽灵障碍"——用户 2026-09-29
    #                        原话："障碍物消失了，感知也没有清除障碍物"；表现是车
    #                        对着空处一直 BLOCKED，单靠 replan 永远出不来。
    #                      · 障碍被车顶走 / 定位跳变后旧观测留在滑窗里；
    #                      · 上层逻辑（区域刚开放）改过而局部图还记着旧占格。
    #   ⚠ 清图的代价（必须知道）：2D 层变**未知**，在"未知按可通行"的配置下局部图
    #     会短暂地"什么都看不见"（~0.2~0.5 s 内被新点云重建）。静态障碍的安全由
    #     **全局图融合**（`local.fuse_global_map`）兜底 ⇒ 不会因为清图去撞已知的墙。
    #   配成未知名字会在启动时 WARN 并且被挡即判失败。
    #
    # ★ 这里以前是**空的实现**，后果比想象严重：进入 RECOVERING 后没人跑恢复、
    #   也没有事件把它推出去 ⇒ 状态机永久卡在 RECOVERING，任务既不会完成也不会
    #   失败，而且 RECOVERING **不接受新目标**（实测：仿真里被挡一次后，后续目标
    #   全被静默拒绝，只能重启节点）。
    sm.recovery.type: "clear_map"
    # 重规划防抖 [s]：距上次成功规划不到该间隔就**如实报恢复失败**（0 = 关闭，
    # 默认）。默认关的理由：额度上限 max_recoveries 已经收住了"挡住→恢复→再挡"，
    # 第二道闸只会把"规划后 0.3 s 才出现的动态障碍"这类**真可恢复**的情况直接判失败。
    replan.min_interval_s: 0.0
    # 清图防抖 [s]（同一口径；用**墙钟**判，因为清图是 I/O 动作）。默认 0 = 关闭。
    clear_map.min_interval_s: 0.0


    # ---------------------------------------------------------------- 轨迹优化（P6 后端 / MINCO）
    # 语义：把 A* 折线变成"几何 + 运动学可行"的时间参数化轨迹（= 剖面），
    #       MPC 只负责跟踪。参数与主链路**同源**：距离场/轮廓判定器都用上面
    #       common.* 与 footprint.* 那几个键，不在这里另配一套（跨层配两遍必打架）。
    # 阶段性验证：ros2 run pnc_2d traj_viz_node --ros-args \
    #             --params-file <这个文件>，然后在 RViz 里加 Path 显示
    #             /pnc_2d/global_path（A*）与 /pnc_2d/minco_traj（MINCO）对比。
    # ★★ A/B 开关（M4.2 起它控制**主链路**了）：
    #   traj.type: "none"  → 全局节点不跑轨迹优化，下发 A* 原路径 + 空剖面
    #                         ⇒ **与接通前一字不差**（现网行为）；
    #   traj.type: "minco" → free 模式（无走廊）下，A* 折线 → MINCO 时间参数化，
    #                         通过两道门（净距终检 + 运动学终验）才替换路径，
    #                         并把速度/转向速率剖面一起下给 MPC。
    #   走廊模式（route）**永远不优化**（贴线是硬约束，挪线等于改需求）。
    #   traj_viz_node（离线调试节点）不读这个键：它总是跑 MINCO。
    traj.type: "none"                  # none | minco
    # 换路径时下发的点间距 [m]。★ **不得小于 5 cm**：MPC 用相邻路径点算切向，
    # 点太密时切向会被积分/栅格噪声主导（下面会 max(0.05, 该值) 兜一道）。
    traj.publish_spacing: 0.05

    # 路点取法：**时间等分**（步长 time_step），弧长按下面的加速受限剖面走。
    # ★ 反过来（弧长等分 + 时间按剖面走）会让每段时间在 3~4 倍范围内变化而 s 增量均匀，
    #   带状系统会解出剧烈摆动（实测中段 2.15 m/s、s 冲过终点 3 m 再回来）。
    traj.time_step: 0.40               # [s] 段数 ≈ 轨迹时长/它，夹在 3~60
    traj.resample_ds: 0.15             # [m] 平滑与弧长参考用的折线重采样间距
    # 平滑（Stage A：几何避障）。净距目标 = 车体**外接圆半径** + smooth_margin，
    # 实测默认 0.622 m（外接圆 0.472 + 0.15）。
    traj.smooth_margin: 0.15           # [m] 在车体外接圆半径之上再留多少
    traj.smooth_w_smooth: 3.0          # 二阶差分（平滑）权重
    # ★ 2026-09-28 由 1.0 提到 3.0：1.0 时**圆不动 45° 折点**，MINCO 时间缩放
    #   ×2.49 > 2.0 被质量门拦下（等于白装）；3.0 后折点最大残角 5°、MINCO 采纳
    #   （110 点 / 5.81 m）。之所以敢提，是因为同时开了 freeze_ends 与 w_keep
    #   两道“不许变差”的锁（见下）。
    traj.smooth_w_sdf: 2.0             # 净距罚权重（**这才是"避障推多使劲"的杠杆**）
    # ★ 实测（贴墙 10 m；用例 AvoidanceWeightVsAchievedClearanceIsMonotoneAndMeasured）：
    #     w_sdf  2 → 达成 0.607 m / 路径偏移 0.036 m
    #     w_sdf  4 → 达成 0.611 m / 路径偏移 0.037 m
    #     w_sdf  8 → 达成 0.615 m / 路径偏移 0.038 m
    #     w_sdf 16 → 达成 0.619 m / 路径偏移 0.039 m
    #   收益**单调但饱和**、代价（偏移）几乎不变 ⇒ 真在地图上看到终检拦停时可调到 8；
    #   先留在 2.0（项目纪律：量到收益才改）。
    traj.smooth_w_anchor: 0.2          # 锚定权重（别离原计划太远）
    # ★ 端点**切线**锚定权重（0 = 关）。罚"首/末段方向"偏离原计划。
    #   2026-09-28 实测（目标 (14.27,2.87,87.9°)）：只罚位置不罚方向的话，平滑会把
    #   尾段整体平移出去让开禁行区 Z3（位置代价很小），末段方向从 90° 变成
    #   **133.6°**；而终点朝向是硬约束 87.9° ⇒ 最后 0.15 m 要转回 45.7°
    #   ⇒ 尾段"yaw 猛摆 + 弧长不前进"⇒ ① 终检不过 ② 时间缩放 ×4.7。
    #   开 1.0 后：终检不再因几何失败、时间缩放 4.7→2.4（中段横向调整仍自由）。
    traj.smooth_w_end_dir: 1.0
    # ★ 端点**冻结**（0 = 关，只冻结起/末这么多个自由点）。折点在首末段时，
    #   “平滑”会拿端点当支点把整段甩出去 ⇒ 冻住端点区域的 N 个点，只让中段动。
    #   实测（目标 (14.27,2.87,87.9°)，w_smooth=3）：0 → 端点被甩、终检在首末段
    #   报几何不过；2 → 折点残角 5°、采纳、且首末段形状与原计划一致（110 点）。
    traj.smooth_freeze_ends: 2
    # ★★ “**不得比原计划更差**”罚项（0 = 关）：逐点硬下限 = 原计划在该点的净距
    #   `d_keep[i] = min(舒适目标, 净距(锚点))`，`d < d_keep` 才有罚。
    #   没有它的时候：`w_smooth=3` 会把 38 个平滑点里的 **30 个**推得比 A* 折线
    #   更贴障碍（最大超差 0.257 m）——“圆折点”的代价被藏在了整车看不到的地方。
    #   开 20 后终态违规 **0/38**，全程最小净距 0.418 m ≥ 原计划 0.400 m
    #   （实测：`PNC_TRAJ_DEBUG=1` 会打印 “keep 终态违规 N/M 个点”）。
    traj.smooth_w_keep: 20.0
    # ★★ 机制 ①（端点自适应 `safeDis = min(ratio × 端点实测净距, 目标)`）**默认关闭**。
    #   实测（用户 2026-09-24 批准的"做 A"）：贴着墙走时
    #     开 0.85 → 端点下限 0.492 / **实际达成 0.578 m** / 缺口 0.007
    #     关（默认）→ 端点下限 0.622 / **实际达成 0.607 m** / 缺口 0.015
    #   ⇒ **降低目标 ⇒ 罚项提前归零 ⇒ 实际达成净距变低**（结构性单调关系），
    #     而终检查的是**实际净距** ⇒ 开它只会让拦停**更频繁**。
    #   原版用它是对付"起点在死角落里"（那里宁可少推也不要把路径挤歪），
    #   与我们的判据方向相反 ⇒ 置 0 关闭（同 max_length_m: 0 = 不截断 的约定）。
    traj.smooth_safe_ratio: 0.0        # [-] 0 = 关闭端点自适应
    traj.smooth_ramp_len: 1.0          # [m] 端点自适应目标的过渡长度（ratio > 0 时才用）
    traj.smooth_iters: 80              # L-BFGS 最大迭代
    # 运动学硬上限（必须是底盘真值；与 local_mpc 同源，改要一起改）
    #   ★★ 2026-09-24 实测：这组曾经漂了 2 倍（`traj.v_max` 0.90 vs
    #      `local_mpc.v_max` 0.42；`traj.v_ref` 0.60 vs `reference_speed` 0.35）。
    #      后果是**剖面的上半段每一拍都被下游裁掉** —— M4.4 的"参考偏差"
    #      均值 32.7%、>10% 的拍数 254/317。它看起来像"剖面没生效"，实际是
    #      上下游说的不是同一个上限（不是控制问题）。对齐后这个数才真正在回答
    #      "剖面被采纳了吗"。⇒ 这就是本仓库那句"跳层配两遍必打架"。
    #   ⚠ 下列三项**仍未同源**，有意留给标定决定（不要静默对齐）：
    #      · traj.a_max 0.50 < local_mpc.a_max 0.60：上游更保守，不会下游裁掉；
    #      · traj.alpha_max 2.50 > local_mpc.alpha_max 1.50：上游更松，ω 的
    #        变化率会被 MPC 裁（ω 本身的上界已同源 0.65）；
    #      · local_mpc.brake_acc 0.15 < traj.a_max 0.50 ⇒ **本地终点制动比上游紧**，
    #        靠近目标那一段仍会盖住剖面 —— 那是有意的（0.15 是底盘实测贴拢值）。
    traj.v_max: 0.42                   # [m/s] = local_mpc.v_max（实测饱和值 0.415）
    traj.a_max: 0.50                   # [m/s^2] ≤ local_mpc.a_max(0.60)：宁可保守
    traj.w_max: 0.65                   # [rad/s] = local_mpc.w_max
    traj.alpha_max: 2.50               # [rad/s^2] > local_mpc.alpha_max(1.5)（见上）
    traj.v_ref: 0.35                   # [m/s] = local_mpc.reference_speed（巡航参考）
    traj.min_piece_time: 0.05          # [s]
    # 采样与终点
    traj.output_dt: 0.05               # [s] 输出采样步长（= 剖面的时间分辨率）
    traj.integrate_dt: 0.01            # [s] 输出用的 Simpson 积分步长
    traj.scan_dt: 0.05                 # [s] 终点修正/时间缩放用的粗积分步长
    traj.terminal_tol: 0.01            # [m] 终点 XY 容差（XY 是 (θ,s) 的积分派生量）
    traj.terminal_iters: 12
    traj.max_solve_ms: 50.0            # [ms] 超预算只记一笔（不失败）
    traj.clearance_exclude_s: 0.20     # [m] 净距统计排除首端这么长（首点=车自己）
    # ★ 时间缩放**质量门**（2026-09-28 加，M5.5 实测的产物）：`st.time_scale`
    #   超过它就不采用这条轨迹，退回 A* 折线。0 = 关。
    #   为什么必须单独拦：M5.5 让"起点机头与路径方向差 > 45°"也去做优化后，
    #   实测 MINCO 会给出
    #     `折线 4 点 / 5.54 m → 轨迹 5.84 m / **92.29 s** | max|v| 0.09 | 缩放 ×4.725`
    #   甚至 `6.00 m → 6.14 m / **256.71 s** | max|v| 0.05 | 缩放 ×12.963` ——
    #   那其实是"原地转/爬行"，**但运动学终验会通过**（缩放后确实满足
    #   |v|/|ω|/|a| 限值），终检也可能过 ⇒ 只看那两道门就会把一条 4 分钟的轨迹
    #   下发给 MPC（参考速度被压到 0.05 m/s）。
    #   触发条件（实测两处）：① 起点朝向差大；② **目标朝向**与路径末段方向差大
    #   （都要靠"到点原地对正"，而那是底盘/局部层的事，摊进轨迹就是怪物）。
    #   正常情况缩放 ≈ 1.0（回归里 free 直线段实测 1.0）。
    traj.max_time_scale: 2.0

    # ---- M3 轨迹终检（逐位姿、含朝向的全机轮廓检查；这是**交付门**）
    # 口径见 core/trajectory_optimizer.hpp 的 checkTrajectory：
    #   硬门不过 ⇒ status=CHECK_FAILED，调用方**不得执行** samples（降级 A* 原路径）。
    traj.check_ds: 0.02                # [m] 弧长采样间距（计划书定的 2 cm）
    traj.check_dyaw: 0.10              # [rad] 朝向采样间距（≈5.7°）
    # ★ 终检是**两遍**，判据不同、代价差一个数量级（见 core/trajectory_check.cpp）：
    #   ① 硬门：按 (check_ds, check_dyaw) 细分，默认用**便宜的布尔判定**
    #      （方向预计算表 ~3 µs）；`check_hard_margin > 0` 才退回净距二分。
    #   ② 统计（最小净距）：按下面这两格走 `signedClearanceAt`。
    #   ★ 为什么必须拆：`signedClearanceAt` 内部是 14 步二分、每步重建一次轮廓偏移表
    #     （~20~40 µs）⇒ 用户现场（40 m 路径、1891 个输出点）一遍 2 cm 净距二分要
    #     **122.7 ms**（超 50 ms 预算），实测绝大部分耗在这里。拆开约 **9× 提速**。
    traj.check_stats_ds: 0.10          # [m] 统计网格（硬门已保证不碰，只需一个"数"）
    traj.check_stats_dyaw: 0.20        # [rad]
    # ★ 为什么 dyaw 不能省：轨迹会**原地转**（起点朝向与路径首段差很大时就是，
    #   实测头 1 s 位移 0.001 m）。原地转几乎不产生弧长 ⇒ 只按 ds 采会**整段漏掉**
    #   旋转扫掠的区域。判据取证：同一场景只按弧长采 = 2 个位姿、判"通过"；
    #   带 dyaw = 33 个位姿、抓出 19 个不过、最差净距 -0.039 m。
    traj.check_hard_margin: 0.0        # [m] 硬要求：真实轮廓净距不得低于它。0 = "不碰"
    # ★ 为什么不取 footprint.safe_margin（0.05）：轮廓判定把位姿**吸附到格心**
    #   （误差 ±半格 = ±5 cm，见 footprint_collision.hpp），半格量级的余量当硬门会
    #   **随机失败** —— 那是判据噪声，不是性能问题。余量只作为 warn 报出来。
    traj.check_warn_margin: 0.05       # [m] 低于它只记一笔（不改 status）

    # 阶段性验证节点（traj_viz_node）的话题
    traj.viz.input: "pnc_2d/global_path"
    traj.viz.output: "pnc_2d/minco_traj"
    traj.viz.status: "pnc_2d/minco_status"
