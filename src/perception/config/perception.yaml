#######################################################################
# 独立感知节点（GridMap）配置
#
# 参数由 planner.yaml 的 grid_map 段派生，只改与"接入定位输出"有关的两处：
#   grid_map.frame_id      : world -> map   （lightning 的固定系叫 map）
#   grid_map.need_extrinsic: 保持 false     （外参已在定位侧折算进位姿）
#
# 节点名必须与 launch 中的 name 一致。
#######################################################################
perception_node:
  ros__parameters:
    use_sim_time: false

    # ==================================================================
    # 地图几何
    # ==================================================================
    grid_map.resolution: 0.05
    grid_map.sliding_map_size_x: 10.0
    grid_map.sliding_map_size_y: 10.0
    grid_map.sliding_map_size_z: 5.0
    # local_update_range 必须 <= size/2：超出这个范围的点只做无命中射线（清空），
    # 不写入占据，用于把"传感器前方空区"和"远处未知"区分开。
    grid_map.local_update_range_x: 5.0
    grid_map.local_update_range_y: 5.0
    grid_map.local_update_range_z: 2.5

    # 滑动地图：以传感器位置为中心滚动。只依赖 sensor_pose，不需要 body_pose
    # （body_pose 仅用于广播 sliding_map TF 帧，见 grid_map.cpp 的 updateSlidingMap）。
    grid_map.map_sliding_en: true
    grid_map.map_sliding_thresh: 0.2

    # ==================================================================
    # 坐标系（接入 lightning 的关键项）
    # ==================================================================
    # 所有输出点云/marker 的 header.frame_id，也是滑动地图 TF 的父帧。
    # 设为 map 后，grid_map/occupancy 可直接与 lightning/global_map 叠合。
    grid_map.frame_id: map
    grid_map.sliding_map_frame_id: sliding_map

    # ==================================================================
    # 感知输入接口（与 lightning/perception/* 的契约）
    # ==================================================================
    grid_map.sensor_type: lidar
    # lightning/perception/cloud 已经是 map 系点云 -> 坐标直接当世界系用。
    # 若置 false，点云会被当作 sensor 系再经 ray_q/ray_pos 变换一次，栅格必然错位。
    grid_map.cloud_is_world: true
    # lightning/perception/pose 已经是 map -> lidar_link（T_map_base*T_base_imu*T_imu_lidar）。
    # 若置 true，会在该位姿上再乘一层 lidar_extrinsic_，raycast 起点静默偏掉。
    grid_map.need_extrinsic: false

    # ==================================================================
    # 占据概率模型（log-odds 融合）
    # ==================================================================
    grid_map.p_hit: 0.85
    grid_map.p_miss: 0.30
    grid_map.p_min: 0.12
    grid_map.p_max: 0.98
    grid_map.p_occ: 0.80
    grid_map.max_ray_length: 5.0

    # ==================================================================
    # 障碍膨胀（用于后续规划避障；纯感知验证阶段可保持原值）
    # ==================================================================
    grid_map.obstacles_inflation_z_up: 0.1
    grid_map.obstacles_inflation_z_down: 0.1
    grid_map.double_cylinder_radius: 0.25
    grid_map.double_cylinder_offset: 0.18

    # ==================================================================
    # 可视化
    # ==================================================================
    # 只影响 grid_map/occupancy、occupancy_inflate、unknown 这三个"给人看"的点云：
    # grid_map.cpp 里会跳过 z > ray_pos.z + vis_height 的体素。
    # 注意 ray_pos 是雷达位置（map 系），不是地图原点，所以这是"传感器上方多少米"。
    # 地图数据本身不受影响：occupancy_buffer_ 完整保留 local_update_range 内的全部高度。
    grid_map.vis_height: 2.0
    grid_map.show_occ_time: false
    # 仅用作 map_origin_ 的 z 初值（grid_map.cpp:88），滑动地图随后会重新居中到传感器，
    # 因此只要不是离传感器太远的值即可。
    grid_map.ground_height: 0.0

    # ==================================================================
    # 2D 局部感知产物（给 2D 规划用）
    #
    # 由 3D 占据栅格按"高度带"投影得到，输出三样东西：
    #   grid_map/occupancy_2d          nav_msgs/OccupancyGrid   原始占据（100/0/-1）
    #   grid_map/occupancy_inflate_2d  nav_msgs/OccupancyGrid   同上，来自 3D 双圆柱膨胀
    #   grid_map/esdf_2d               PointCloud2(xyz+intensity=距离 m)  2D ESDF
    #
    # 注意：代码里 enable_2d 的默认值是 false，只有本配置显式打开；
    #       3D 规划器用的 planner.yaml 没写这一项 → 行为与改动前完全一致、零额外开销。
    # ==================================================================
    grid_map.enable_2d: true
    grid_map.pub_2d_occupancy: true
    grid_map.pub_2d_occupancy_inflate: true
    grid_map.pub_2d_esdf: true
    # 发布节流（秒）。2D 层在每次 3D 融合后重建，但发布不必那么频繁；
    # 0 = 每次 visCallback（20Hz）都发。
    grid_map.pub_2d_interval: 0.1

    # ---- 3D -> 2D 投影高度带（只有带内的体素参与投影）----
    # ⚠ 下沿必须**高于地面**，否则地面被投影成障碍、整张 2D 图会全黑。
    #   仿真里雷达起点离地约 0.36m → 地面在 map 系 z≈-0.36；
    #   取 -0.20（离地 0.16m）既能排掉地面，又留了 SLAM 高度漂移的余量。
    #   上沿 1.20 覆盖墙体/桌子，排除天花板与树枝。
    # proj_relative_to_sensor=true 时下面的值变成"相对当前传感器高度上/下多少米"（上下楼梯时更稳）。
    grid_map.proj_relative_to_sensor: false
    grid_map.proj_z_min: -0.20
    grid_map.proj_z_max: 1.20

    # ---- 2D ESDF ----
    grid_map.esdf_max_dist: 3.0              # 距离截断（米）：限带宽也限算力
    grid_map.esdf_unknown_as_occupied: false # 未知区域是否当障碍（默认乐观，与 3D 层一致）
    grid_map.esdf_pub_step: 2                # 发布抽点步长（2 = 每隔一个格发一个点）

    grid_map.topic_2d_occupancy: "grid_map/occupancy_2d"
    grid_map.topic_2d_occupancy_inflate: "grid_map/occupancy_inflate_2d"
    grid_map.topic_2d_esdf: "grid_map/esdf_2d"

    # ==================================================================
    # 以下为 depth 相机路径参数，sensor_type=lidar 时不生效，
    # 保留原值以便与 planner.yaml 对照 / 将来切 depth 输入。
    # ==================================================================
    grid_map.cx: 321.04638671875
    grid_map.cy: 243.44969177246094
    grid_map.fx: 387.229248046875
    grid_map.fy: 387.229248046875
    grid_map.depth_filter_maxdist: 3.0
    grid_map.depth_filter_mindist: 0.3
    grid_map.depth_filter_margin: 1
    grid_map.k_depth_scaling_factor: 1000.0
    grid_map.skip_pixel: 2
