#######################################################################
# A* 模式参数片段（pnc_2d / astar）
#
# 这份文件**只放 A* 私有参数**，并自述 planner.type；话题/代价语义/车体轮廓在
# config/pnc_2d.yaml（总入口）里。launch 会把两份按顺序合并，**本文件在后、覆盖总入口**。
#
# 单独用：ros2 launch pnc_2d global_planner.launch.py planner_type:=astar
# 值的含义见 doc/pnc2d_dev_plan.md §6；触发方式是事件驱动：收到 /goal_pose 才规划一次。
#######################################################################
/**:
  ros__parameters:
    # 自述类型：单独看这份文件就知道它给哪个算法用
    planner.type: "astar"

    # ==================================================================
    # A* 参数
    # ==================================================================
    astar.connectivity: 8              # 4 或 8 邻域（8 邻域含斜穿保护）
    astar.heuristic_weight: 1.0        # >1 加速但可能次优（<1 会破坏最优性）
    astar.use_search_window: true      # 只在起终点包围盒附近搜索（大图省一个量级）
    astar.search_window_margin: 10.0   # 首次窗口余量（m）
    astar.search_window_retry_margins: [30.0, 100.0, 1.0e9]   # 失败后逐级扩大
    astar.max_iterations: 300000       # 扩展节点上限
    astar.max_search_time_ms: 2000.0   # 单次搜索时间上限（ms）    # 起点轮廓已经与障碍重叠时，**只在起点周边**允许放宽的半径 [m]（0 = 不允许）。
    #   ★ 为什么必须限制在起点附近（2026-09-23 实测）：栅格 A* 没法“只放宽首点”。
    #     第一版把**整条路径**都换成放宽后的轮廓 ⇒ 起点只要刚好贴到余量（差 1 mm），
    #     整条路都按零余量规划 ⇒ 一路贴墙走，车最后停在离障碍真净距 0.15 m 的地方
    #     （footprint 半宽 0.20 ⇒ 已经压上去了），现场就是“绕障效果更差”。
    #   圈内从大到小试 {0.04,0.03,0.02,0.01,0}（含 0 = 真实轮廓）；**不再到负余量**
    #   —— 负余量等于规划一条“车体真实轮廓本来就压进障碍”的路，局部跟着开就是擦墙
    #   （实测：车停在离障碍 0.15 m，而半宽 0.20 ⇒ 已压上去）。
    #   为什么需要它：全局图（已按 map_server.inflate 膨胀、禁行区已按 zones.inflate
    #   烧入）与感知图不同源 + 栅格离散化（±半格），“全局图上刚好差 1 mm”是常态；
    #   起点一律判死会变成“局部 BLOCKED → 恢复重规划又失败 → 任务永久 FAILED”。
    astar.start_escape_radius: 1.0
    # ---------------- 路径后处理 ----------------
    astar.path_prune_mode: "line_of_sight"   # line_of_sight / collinear / none
    astar.path_prune_max_span: 8.0           # 单次捷径检查的最大跨度（m）
    # 剪枝捷径要求**比 A* 节点检查再多留**的余量 [m]（0 = 关，老行为）。
    #
    # ★ 为什么需要（2026-xx 现场碰撞取证，目标 (14.27, 2.87)，Go2 走廊）：
    #   `line_of_sight` 把"绕开障碍的折线"换成一条**长弦**，长弦会切内角 ⇒
    #   **车身余量被吃掉**。离线实测同一条路：
    #       不剪枝（109 节点）最窄车身余量 13 cm
    #       line_of_sight 剪枝后  最窄车身余量  8 cm（路程只短 4%）
    #   8 cm 已经落在"MPC 横向跟踪误差（几 cm ~ 20 cm）"的量级里 ⇒ 规划上
    #   合法、实际跟随时车体就擦上去了（用户报"走到一半碰撞"，实测最窄点
    #   里程 2.73 m / 全程 5.47 m ≈ 一半 ✓）。
    #
    #   为什么不直接把 `footprint.safe_margin`（0.05）调大：那是**硬判据**，
    #   会把用户定的"最窄可通 0.60 m"一起掐死（半宽 0.20 + margin 0.05 +
    #   map_server.inflate 0.05 = 0.30 m 就是"左右各 10 cm"）。这里只约束
    #   **可选的**捷径：弦撑不开这么多余量就退回走 A* 的折线节点 ⇒
    #   **永远不会把一条本来可行的路变成不可行**，代价只是路径点变多、略长。
    #   0.10 = 现场实测丢失量（5 cm）的两倍，先把余量给足；离障碍已经很远的
    #   开阔段长弦照样通过（实测长度几乎不变：5.47 → 5.49 m）。
    astar.path_prune_extra_margin: 0.10
    astar.path_resample_spacing: 0.0         # >0 时按弧长重采样（m）
    astar.keep_start_yaw: true               # 首点保留当前朝向（供控制器原地对正）
