#######################################################################
# 独立感知节点（GridMap）配置
#
# 参数由 planner.yaml 的 grid_map 段派生，只改与"接入定位输出"有关的两处：
#   grid_map.frame_id      : world -> map   （lightning 的固定系叫 map）
#   grid_map.need_extrinsic: 保持 false     （外参已在定位侧折算进位姿）
#
# 节点名必须与 launch 中的 name 一致。
#######################################################################
perception_node:
  ros__parameters:
    use_sim_time: false

    # ==================================================================
    # 地图几何
    # ==================================================================
    # ⚠ 分辨率是全局的（3D + 2D 一起变），也是性能的最大杠杆：
    #   0.05 → 0.10 实测每帧 3D 融合 1854ms → 313ms（体素数 ∝1/res³、射线步数 ∝1/res）。
    #   代价：障碍边界量化误差 ±2.5→±5cm；薄障碍表观厚度翻倍（实测占据面积 0.09→0.17m²）；
    #   台阶/降障的高度分辨力减半（3D 规划要留意）；好处是规划搜索节点数 ÷4。
    grid_map.resolution: 0.10
    # 窗口尺寸：体素数 = (x/res)*(y/res)*(z/res)，直接决定所有 O(体素数) 操作的开销
    # （可视化发点云的扫描、每次滑动清图的内存分配/清零、换图时的 fill）。
    # 10x10x5 → 8x8x4 实测体素数 50万 → 25.6万（-49%）。
    grid_map.sliding_map_size_x: 8.0
    grid_map.sliding_map_size_y: 8.0
    grid_map.sliding_map_size_z: 4.0
    # local_update_range 必须 <= size/2：超出这个范围的点只做无命中射线（清空），
    # 不写入占据，用于把"传感器前方空区"和"远处未知"区分开。
    # 这是控制"每帧融合多少点"的正规旋钮（与地图大小无关）。
    # ⚠ 它与下面的 max_ray_length 是一对：这里是"写占据"的范围，那里是"清空"的
    #   半径。两者脱节就会出现一圈"能写障碍却不清空"的带子 → 2D 图一大片未知。
    grid_map.local_update_range_x: 4.0
    grid_map.local_update_range_y: 4.0
    grid_map.local_update_range_z: 2.0

    # 滑动地图：以传感器位置为中心滚动。只依赖 sensor_pose，不需要 body_pose
    # （body_pose 仅用于广播 sliding_map TF 帧，见 grid_map.cpp 的 updateSlidingMap）。
    grid_map.map_sliding_en: true
    grid_map.map_sliding_thresh: 0.2

    # ==================================================================
    # 坐标系（接入 lightning 的关键项）
    # ==================================================================
    # 所有输出点云/marker 的 header.frame_id，也是滑动地图 TF 的父帧。
    # 设为 map 后，grid_map/occupancy 可直接与 lightning/global_map 叠合。
    grid_map.frame_id: map
    grid_map.sliding_map_frame_id: sliding_map

    # ==================================================================
    # 感知输入接口（与 lightning/perception/* 的契约）
    # ==================================================================
    grid_map.sensor_type: lidar
    # ---- 输入话题（相对名会被解析成 <命名空间>/名字；也可以写绝对名 /xxx）----
    # 这两项等价于原来写死的 cloud / sensor_pose：改 yaml 即可，不必改代码；
    # 若 launch 里又做了 remap（-r cloud:=...），remap 优先级更高。
    grid_map.topic_cloud: "cloud"
    grid_map.topic_pose: "sensor_pose"
    # 滑动地图 TF 原点（发 sliding_map_frame_id 那帧 TF 用）。
    # ⚠ 不能删：删了这帧 TF 就会一直发在原点。上游没有对应话题时可不接。
    grid_map.topic_body_pose: "body_pose"
    # 定位阶段（换图/失败 -> 清空栅格，否则旧地图体素会变成“幽灵障碍”）。
    # 换定位源时记得改这里，否则此机制静默失效。
    grid_map.topic_map_state: "lightning/map_state"
    # lightning/perception/cloud 已经是 map 系点云 -> 坐标直接当世界系用。
    # 若置 false，点云会被当作 sensor 系再经 ray_q/ray_pos 变换一次，栅格必然错位。
    grid_map.cloud_is_world: true
    # lightning/perception/pose 已经是 map -> lidar_link（T_map_base*T_base_imu*T_imu_lidar）。
    # 若置 true，会在该位姿上再乘一层 lidar_extrinsic_，raycast 起点静默偏掉。
    grid_map.need_extrinsic: false

    # ---- 2D 层 footprint 清除：机器人自身尺寸（换机器只改这里）----
    # 每帧把机器人自身占的那块矩形从 2D 图上抹掉（占据层 + 膨胀层），
    # 于是"机器人脚下永远不是障碍"与自车点云从哪来无关（雷达/相机/累积图都一样）。
    # Nav2 的 local costmap 也是这个做法（每周期清 footprint 区域）。
    # 矩形定义在**机体系**：length = 前后（x），width = 左右（y）；
    # 朝向取 sensor_pose 的 yaw（= 机体朝向 ⊗ 雷达安装角；实际朝向不一致时用
    # yaw_offset_deg 修）。中心对称矩形对 180° 偏差不敏感。
    # ⚠ 判定按"格与矩形相交"（矩形外扩半格 = resolution/2，当前 0.10m 时即 5cm）：
    #   直接填**真实机体尺寸**即可，不用自己加余量，也不会沿边缘漏一圈。
    grid_map.footprint_clear_enable: true
    grid_map.footprint_length: 0.70   # 机体系 x：前后（m）  ← Go2
    grid_map.footprint_width: 0.40    # 机体系 y：左右（m）
    # 雷达不在机体几何中心时，用这两个把矩形挪正（机体系，m）：
    #   例：雷达装机体前 0.29m 处 → offset_x: -0.29
    grid_map.footprint_offset_x: 0.0
    grid_map.footprint_offset_y: 0.0
    grid_map.footprint_yaw_offset_deg: 0.0
    grid_map.footprint_clear_as_unknown: false  # true = 抹成未知(-1)，默认抹成空闲(0)
    # footprint 可视化（MarkerArray：绿色轮廓 + 半透明填充），RViz 里加 MarkerArray
    # 显示项、话题 grid_map/footprint 即可看到矩形跟着机器人转。
    grid_map.pub_footprint_viz: true
    grid_map.topic_footprint_viz: "grid_map/footprint"

    # ==================================================================
    # 占据概率模型（log-odds 融合）
    # ==================================================================
    grid_map.p_hit: 0.85
    grid_map.p_miss: 0.30
    grid_map.p_min: 0.12
    grid_map.p_max: 0.98
    grid_map.p_occ: 0.80
    # 射线上限（= 每帧能把多远**清成空闲**的半径）：
    #   raycastProcess() 里 length > max_ray_length 的点会被截断到该半径并标为
    #   free —— 所以它就是 2D 图里"未知面积"的直接阀门。
    # 它与 local_update_range 是一对儿，必须自洽：
    #   · 5.0 → 2.0 实测每帧 -33~39%（为了提帧率改的）；
    #   · 但 2.0 配 8x8m 窗口时日测 2D 图 未知 63% / 空闲 36%
    #     （2.0m 处空闲率 88% → 2.5m 处骤降 52% → 4.5m 处 6%）：
    #     2~4m 一圈能写障碍却不清空，规划器看到的是"未知里夹着障碍"。
    # → 现在打开 ray_length_from_local_range，两者自动一致；
    #   max_ray_length 仅作为开关关闭时的显式值（也是日志里的回退提示）。
    grid_map.ray_length_from_local_range: true
    grid_map.max_ray_length: 4.0

    # ==================================================================
    # 障碍膨胀（用于后续规划避障；纯感知验证阶段可保持原值）
    # ==================================================================
    grid_map.obstacles_inflation_z_up: 0.1
    grid_map.obstacles_inflation_z_down: 0.1
    grid_map.double_cylinder_radius: 0.25
    grid_map.double_cylinder_offset: 0.18

    # ==================================================================
    # 可视化
    # ==================================================================
    # 只影响 grid_map/occupancy、occupancy_inflate、unknown 这三个"给人看"的点云：
    # grid_map.cpp 里会跳过 z > ray_pos.z + vis_height 的体素。
    # 注意 ray_pos 是雷达位置（map 系），不是地图原点，所以这是"传感器上方多少米"。
    # 地图数据本身不受影响：occupancy_buffer_ 完整保留 local_update_range 内的全部高度。
    grid_map.vis_height: 2.0
    # true = 每处理一帧打一行计时：点云回调 / 3D 融合 / 2D 层 / 帧间隔 / 点数
    grid_map.show_occ_time: true
    # ---- 可视化开销控制 ----
    # vis_interval：可视化定时器周期（TF/bbox/footprint/2D 都跟它）。
    grid_map.vis_interval: 0.10
    # pub_map_interval：那两个“3D 占据/膨胀点云”的发布间隔。
    # 它们现在走增量占据索引（不再是全图扫描），但收发点云本身仍有成本，
    # 2~5Hz 足够看，不必与 TF 同频。
    grid_map.pub_map_interval: 0.25
    # 占据索引自检（调试用）：每秒用暴力全扫核对一次索引有没有漏记
    grid_map.verify_occ_idx: false
    # 仅用作 map_origin_ 的 z 初值（grid_map.cpp:88），滑动地图随后会重新居中到传感器，
    # 因此只要不是离传感器太远的值即可。
    grid_map.ground_height: 0.0

    # ==================================================================
    # 2D 局部感知产物（给 2D 规划用）
    #
    # 由 3D 占据栅格按"高度带"投影得到，输出三样东西：
    #   grid_map/occupancy_2d          nav_msgs/OccupancyGrid   原始占据（100/0/-1）
    #   grid_map/occupancy_inflate_2d  nav_msgs/OccupancyGrid   同上，来自 3D 双圆柱膨胀
    #   grid_map/esdf_2d               PointCloud2(xyz+intensity=距离 m)  2D ESDF
    #
    # 注意：代码里 enable_2d 的默认值是 false，只有本配置显式打开；
    #       3D 规划器用的 planner.yaml 没写这一项 → 行为与改动前完全一致、零额外开销。
    # ==================================================================
    grid_map.enable_2d: true
    grid_map.pub_2d_occupancy: true
    grid_map.pub_2d_occupancy_inflate: true
    grid_map.pub_2d_esdf: true
    # 发布节流（秒）。2D 层在每次 3D 融合后重建，但发布不必那么频繁；
    # 0 = 每次 visCallback（20Hz）都发。
    # 0 = 不额外节流，直接跟 vis_interval（10 Hz）同一个节奏，避免两个 0.1s 撞出
    # "跳拍"（实测会变成 6.6 Hz、间隔 150ms）。想要更高/更低就改 vis_interval。
    grid_map.pub_2d_interval: 0.0

    # 2D 层统计日志间隔（秒）：每隔这么久打印一行 2D 图的
    # 空闲/未知/占据 占比 + 清空半径 + 窗口尺寸。0 = 关闭。
    # 用途：窗口尺寸 / local_update_range / max_ray_length 这几个几何参数配歪时
    # 的表现就是"未知占了大半张图"，有这行日志就不必另写脚本去数格子。
    grid_map.pub_2d_stats_interval: 5.0

    # ---- 3D -> 2D 投影高度带（只有带内的体素参与投影）----
    # ⚠ 下沿必须**高于地面**，否则地面被投影成障碍、整张 2D 图会全黑。
    #   仿真里雷达起点离地约 0.36m → 地面在 map 系 z≈-0.36；
    #   取 -0.20（离地 0.16m）既能排掉地面，又留了 SLAM 高度漂移的余量。
    #   上沿 1.20 覆盖墙体/桌子，排除天花板与树枝。
    # proj_relative_to_sensor=true 时下面的值变成"相对当前传感器高度上/下多少米"（上下楼梯时更稳）。
    grid_map.proj_relative_to_sensor: false
    grid_map.proj_z_min: -0.20
    grid_map.proj_z_max: 1.20

    # ---- 2D ESDF ----
    grid_map.esdf_max_dist: 3.0              # 距离截断（米）：限带宽也限算力
    grid_map.esdf_unknown_as_occupied: false # 未知区域是否当障碍（默认乐观，与 3D 层一致）
    grid_map.esdf_pub_step: 2                # 发布抽点步长（2 = 每隔一个格发一个点）

    grid_map.topic_2d_occupancy: "grid_map/occupancy_2d"
    grid_map.topic_2d_occupancy_inflate: "grid_map/occupancy_inflate_2d"
    grid_map.topic_2d_esdf: "grid_map/esdf_2d"

    # ---- 2D 层性能与自检 ----
    # 2D 层默认走“只重扫变化列”的增量路径（实测 2D 构建 12.4ms -> 3.4ms）。
    # 它已用内置自检（verify_2d）在合成负载下逐格比对通过（0 失败）；
    # 上真数据时建议先开一轮 verify_2d 确认。
    grid_map.force_full_2d: false           # true = 每帧全窗口重扫（最保守，等于改动前的行为）
    grid_map.refresh_full_2d_interval: 100  # 每 N 次构建做一次全量刷新兼底（0 = 不做），
                                            # 代价约为全量重扫的 1/N，当保险可留着
    grid_map.verify_2d: false               # true = 每帧用暴力全扫逐格比对增量结果（很费 CPU，
                                            #   仅调试/真数据验证时开，失败会打 ERROR 日志）
    grid_map.esdf2d_query_en: false         # 进程内调 getDistance2D() 且无人订阅 esdf_2d 时必须置 true，
                                            # 否则 ESDF 会陈旧、查询返回 -1

    # ==================================================================
    # 以下为 depth 相机路径参数，sensor_type=lidar 时不生效，
    # 保留原值以便与 planner.yaml 对照 / 将来切 depth 输入。
    # ==================================================================
    grid_map.cx: 321.04638671875
    grid_map.cy: 243.44969177246094
    grid_map.fx: 387.229248046875
    grid_map.fy: 387.229248046875
    grid_map.depth_filter_maxdist: 3.0
    grid_map.depth_filter_mindist: 0.3
    grid_map.depth_filter_margin: 1
    grid_map.k_depth_scaling_factor: 1000.0
    grid_map.skip_pixel: 2
