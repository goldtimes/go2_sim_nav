# =============================================================================
# 参数片段：局部**原地转向装饰器**（`local.type: heading_shim`）
# =============================================================================
# 用法：ros2 launch pnc_2d pnc_2d.launch.py local_type:=heading_shim
#
# 它是什么：一个**装饰器**——实现同一套 `LocalPlanner` 接口，内部建一个主控制器
#   （`shim.primary`，本仓 = mpc，见 `local_mpc.yaml`），在"车头离路的走向太远"
#   时**接管**为原地转，转完把控制权交回去。对应 Nav2 的 RotationShimController。
#   ⇒ 节点侧零改动（换算法只换 `local.type`）。
#
# ★ 为什么单独一层（否则会以为这是过度设计）：
#   · MPC 的目标函数是"贴线 + 前进"，车头差几十度时它只有"边转边走"这一个妥协，
#     而严格走廊下那个解会扫出硬界 ⇒ 代价上"不动"更便宜 ⇒ **车拒动**（实测航向差
#     ≥30° 时 120/120 周期被挡、一步不走，见 test_mpc_local_planner.cpp 的
#     StrictCorridorHeadingSweep）；足式/差速底盘 ω 与 v 是解耦的，原地转物理可行。
#   · 原地转不需要解优化：一个 √(2α·e) 减速律 + 角加速度斜坡就够，而且**不会**给出
#     落进底盘角速度死区的小指令（旧 `align_gain·e` 在误差小时给 0.06 rad/s，
#     车根本不动 —— `align_w_min` 就是为打这个补丁而存在的）。
#   · "谁控车头"必须只有一处：原来 MPC 里有起步对正与到点对正两套（各配 8 个参数）。
#
# ⚠ launch 会**同时加载本片段与 local_mpc.yaml**（装饰器的主控制器要参数）；
#   见 launch/pnc_2d.launch.py 的 LOCAL_FRAGMENT_BY_TYPE。
#
# ⚠ 只改这里，别把 `shim.*` 复制到别的文件/其它片段（"跳层物理量只配一遍"）。

/**:
  ros__parameters:

    shim.primary: "mpc"                  # 主控制器（createLocalPlanner 认得的名字）

    # ---------------- 何时接管（迟滞，防在阈值上抖） ----------------
    # 与**路径前方 0.5 m 处那一点的朝向**比较，不是与"车脚下"比。
    #   ★ 为什么看前方（关键，别改成脚下）：全局路径首点的 yaw 被
    #     `astar.keep_start_yaw: true` 保留成"当前车头" ⇒ 看脚下永远算出 e≈0，
    #     起步对正在真实链路上**等于没生效**（实测就是这么失效的）。
    shim.engage_deg: 45.0                # 超过它 ⇒ 开始原地转 [°]；0 = 关
    shim.disengage_deg: 22.5             # 已经在转时，转到它以下 ⇒ 交棒 [°]
                                         #   ★ 必须 < engage_deg（配置里有兜底钳位）
    shim.forward_sampling_distance: 0.50 # 前瞻距离 [m]
    # ⚠ 已知行为：前瞻导致**急弯前**就会超阈值 ⇒ 车会在弯前停一下、转正、再走
    #   （nav2 同样如此）。必要时把前瞻调小或把 engage_deg 调大。

    # ---------------- 旋转控制律 ----------------
    # |ω| = min(omega_rot, √(2·alpha_max·|e|))，方向 sign(e)，再做角加速度斜坡
    #   clamp(ω, ω_prev ± alpha_max·dt)。
    shim.omega_rot: 0.60                 # 旋转角速度上限 [rad/s]（匀速段的值）
                                         #   ★ R10：交棒那一刻 ω 就是这个量，必须 ≤
                                         #     主控制器能给的角速度（`local_mpc.w_max`
                                         #     = 0.65）→ 0.60 留了一点余量，交棒无阶跃。
                                         #   ★ 它是**刻意**可以大于 `free_w_max: 0.45` 的：
                                         #     自由模式的 ω 上限是为了压"左右打满"的摆动，
                                         #     而这里是有意的原地转，所以按底盘能力
                                         #     （w_max）取。
    shim.alpha_max: 3.20                 # 角加速度上限 [rad/s²]（nav2 的默认值）
                                         #   ★ 不要取小：斜坡起步那几拍的 |ω| 若落在
                                         #     底盘角速度死区里（实测 ~0.20 rad/s），
                                         #     车会先卡零点几秒才动（= 旧 align_w_min
                                         #     要打的补丁）。1.2 时首周期只有 0.06 rad/s；
                                         #     3.2 时 0.16，两拍就起来了。
    shim.closed_loop: false              # 斜坡起点用实测 ω 还是上一条指令。
                                         #   本仓底盘低速 `odom.twist` 不可信 ⇒ 默认 false；
                                         #   若节点侧开了 `local.vel_from_pose`（从位姿差分
                                         #   算 ω），可以打开本项。

    # ---------------- 到终点后的**目标朝向**对正 ----------------
    # 位置到了（剩余 ≤ align_distance）而机头没对到**目标朝向** ⇒ 原地转，转进容差
    #   才算完成。目标朝向 = 路径**末点**的 yaw（全局规划把目标 yaw 放在末点）。
    #
    # ⚠ 这个容差**同时**被节点用于到点判定（走 `LocalPlanner::goalYawTolerance()`）。
    #   不要在节点侧再配一份：两边不一致会出现"算法在转、节点还不算到"卡到超时。
    # ⚠ 阿克曼底盘不能原地转 ⇒ 这种底盘把本项置 0（改用别的策略对朝向）。
    shim.goal_yaw_tolerance_deg: 10.0    # 0 = 不判定朝向
    shim.goal_yaw_align_distance: 0.10   # 距末点多近才管朝向 [m]
                                         #   ⚠ 必须 > `local.goal_tolerance`，
                                         #     否则"节点已判到点、算法还在等朝向"死锁。
    shim.rotation_timeout_s: 6.0         # **无进展**超时 [s]（0 = 不限）：这么久偏差没
                                         #   改善（<2°）⇒ 报 kFailed 并说清还差几度、
                                         #   该查哪个参数。★ 不是墙钟：180° @ 0.45 rad/s
                                         #   本来就要 ~7 s，按墙钟计会把"转得慢但在收敛"
                                         #   判成失败。

    # ---------------- 旋转前的碰撞检查（不许盲转） ----------------
    shim.check_rotation: true            # 关掉 = 盲转（只用于对照实验）
    shim.simulate_ahead_time: 1.0        # 前向模拟多久的转向扫掠 [s]
                                         #   有局部图时用 **footprint 扫掠**（每个采样
                                         #   yaw 都查一次轮廓，与全局规划器同一份
                                         #   `footprint.*` 参数）；没有图时退到"车心净距"。
    shim.min_clearance: 0.25             # 没有局部图时的退路：车心净距下限 [m]
    shim.unknown_as_occupied: false      # 局部图里未知格是否当障碍
                                         #   ★ 与 `common.unknown_as_occupied: true`
                                         #     **故意不同**：那是全局图的口径（图里没有
                                         #     未知格）；局部图是感知滑动窗，没观测到 ≠
                                         #     有障碍，当障碍会让车在新区域永远不敢转身。
